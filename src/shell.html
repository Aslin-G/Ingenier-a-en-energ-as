<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10162B">
<title>Lumina Loop: El Código de los Elementos</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #10162B;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; line-height: 0; }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
    background: #10162B;
    box-shadow: 0 0 40px rgba(89, 199, 255, 0.15);
  }
  /* capa del modo HD: muestra el mismo fotograma con el doble de resolución (no recibe clics) */
  #hd {
    display: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    pointer-events: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #noscript {
    color: #FFF3D7; font: 16px monospace; text-align: center; padding: 2em;
  }
</style>
</head>
<body>
<div id="stage">
<canvas id="game" width="960" height="540" tabindex="0" aria-label="Lumina Loop: El Código de los Elementos. Videojuego educativo en pixel art."></canvas>
<canvas id="hd" width="960" height="540" aria-hidden="true"></canvas>
</div>
<noscript><div id="noscript">Lumina Loop necesita JavaScript activado para funcionar.</div></noscript>
