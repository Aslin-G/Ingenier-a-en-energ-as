for (const k in CAST) if (!SPEAKERS[k]) SPEAKERS[k] = { name: CAST[k].name, color: shade(CAST[k].shirt, 0.25), voice: CAST[k].voice };

const TEXT_CPS = [28, 55, 120, 9999];

const Dlg = {
  box: null,
  open(who, text, expr, choices) {
    const sp = SPEAKERS[who] || SPEAKERS.narrador;
    const hasPortrait = who !== 'narrador' && who !== 'sistema';
    const maxW = hasPortrait ? 410 : 450;
    this.box = { who, sp, text, expr: expr || 'n', lines: wrapRich(text, maxW, who === 'aurora' || who === 'pz' || who === 'sistema' ? (who === 'sistema' ? PAL.lime : '#E8F4FF') : PAL.cream), shown: 0, total: 0, t: 0, choices, sel: 0, done: false, hasPortrait, open: 0 };
    this.box.total = this.box.lines.reduce((s, l) => s + richLen(l), 0);
    if (G.save.settings.textSpeed === 3) this.box.shown = this.box.total;
  },
  close() { this.box = null; },
  update(dt) {
    const b = this.box; if (!b) return null;
    if (G.autoDialog) { b.shown = b.total; return b.choices ? { choice: G.autoChoice || 0 } : { next: true }; }
    b.open = Math.min(1, b.open + dt * 8);
    const cps = TEXT_CPS[G.save.settings.textSpeed] * (Input.down('run') ? 4 : 1);
    if (b.shown < b.total) {
      const prev = Math.floor(b.shown);
      b.shown = Math.min(b.total, b.shown + cps * dt);
      if (Math.floor(b.shown) !== prev && Math.floor(b.shown) % 2 === 0 && b.sp.voice) AudioSys.sfx('text', b.sp.voice * (1 + (Math.random() - 0.5) * 0.12));
    }
    const adv = Input.hit('confirm') || Input.hit('interact') || (Input.pointer.pressed && !TouchPad.consumesPointer(Input.pointer.x, Input.pointer.y));
    const complete = b.shown >= b.total;
    if (b.choices && complete) {
      if (Input.hit('up')) { b.sel = (b.sel + b.choices.length - 1) % b.choices.length; AudioSys.sfx('hover'); }
      if (Input.hit('down')) { b.sel = (b.sel + 1) % b.choices.length; AudioSys.sfx('hover'); }
      // selección con puntero
      const P = Input.pointer;
      const r = this.choiceRects();
      r.forEach((rc, i) => { if (inRect(P.x, P.y, rc)) { if (b.sel !== i && Input.lastDevice === 'mouse') AudioSys.sfx('hover'); b.sel = i; } });
      if (P.pressed) {
        const hit = r.findIndex(rc => inRect(P.x, P.y, rc));
        if (hit >= 0) { b.sel = hit; AudioSys.sfx('confirm'); Input.consume(); return { choice: hit }; }
        return null;
      }
      if (Input.hit('confirm') || Input.hit('interact')) { AudioSys.sfx('confirm'); Input.consume(); return { choice: b.sel }; }
      return null;
    }
    if (adv) {
      Input.consume();
      if (!complete) { b.shown = b.total; return null; }
      AudioSys.sfx('click');
      return { next: true };
    }
    if (complete && Input.down('run') && !b.choices) { b.autoT = (b.autoT || 0) + dt; if (b.autoT > 0.25) return { next: true }; }
    return null;
  },
  choiceRects() {
    const b = this.box; if (!b || !b.choices) return [];
    const w = Math.min(W - 20, Math.max(...b.choices.map(c => textW(c))) + 20);
    const h = 14;
    const x = W - w - 10, y0 = b.atTop ? 82 : 192 - b.choices.length * (h + 2) - 4;
    return b.choices.map((c, i) => ({ x, y: y0 + i * (h + 2), w, h }));
  },
  draw(g) {
    const b = this.box; if (!b) return;
    const lv = G.run.level, top = Scenes.top();
    if (b.open < 0.2) b.atTop = !!(lv && top && top.lv === lv && (lv.player.y - lv.cam.y) > 110);
    const oy = Math.round((1 - easeOut(b.open)) * 20) * (b.atTop ? -1 : 1);
    const x = 6, y = (b.atTop ? 8 : 196) + oy, w = W - 12, h = 70;
    const hc = G.save.settings.highContrast;
    panel(g, x, y, w, h, { bg: hc ? '#000000' : 'rgba(14,18,40,0.95)', border: b.sp.color, hi: shade(b.sp.color, -0.3) });
    let tx = x + 10;
    if (b.hasPortrait) {
      const pt = Portraits.get(b.who, b.expr);
      rect(g, x + 6, y + 6, 36, 36, '#0B1020'); strokeRect(g, x + 5, y + 5, 38, 38, b.sp.color);
      const shake = b.sp.glitch && Math.random() < 0.15 ? randi(-1, 1) : 0;
      g.drawImage(pt, x + 8 + shake, y + 8);
      if (b.sp.glitch && Math.random() < 0.3) rect(g, x + 8, y + 8 + randi(0, 30), 32, 1, '#FF7FCF');
      tx = x + 50;
    }
    // nombre
    if (b.sp.name) {
      const nw = textW(b.sp.name) + 12;
      const ny = b.atTop ? y + h - 4 : y - 9;
      panel(g, tx - 4, ny, nw, 13, { bg: shade(b.sp.color, -0.55), border: b.sp.color });
      if (b.sp.rainbow) { let cx = tx + 2; for (const ch of b.sp.name) { drawText(g, ch, cx, ny + 4, hsl(Time.t * 120 + cx * 8, 90, 70)); cx += Font.charW(ch); } }
      else drawText(g, b.sp.name, tx + 2, ny + 4, b.sp.color);
    }
    // texto
    let remaining = Math.floor(b.shown);
    b.lines.forEach((ln, i) => {
      if (remaining <= 0) return;
      const n = richLen(ln);
      const gx = b.sp.glitch && Math.random() < 0.04 ? 1 : 0;
      drawRichLine(g, ln, tx + gx, y + 10 + i * 12, { limit: remaining });
      remaining -= n;
    });
    // indicador de continuar
    if (b.shown >= b.total && !b.choices) {
      const bob = Math.floor(Time.t * 4) % 2;
      drawText(g, '▼', x + w - 12, y + h - 12 + bob, b.sp.color);
    }
    // opciones
    if (b.choices && b.shown >= b.total) {
      const rects = this.choiceRects();
      rects.forEach((rc, i) => {
        const sel = i === b.sel;
        panel(g, rc.x, rc.y, rc.w, rc.h, { border: sel ? PAL.sun : '#3E4C8A', bg: sel ? '#2A3570' : 'rgba(14,18,40,0.95)' });
        drawText(g, fitText((sel ? '▶ ' : '  ') + b.choices[i], rc.w - 8), rc.x + 5, rc.y + 4, sel ? PAL.sun : PAL.cream);
      });
    }
  }
};

// ---------- Burbujas (frases cortas en el mundo) ----------
const Bark = {
  list: [],
  say(target, text, dur = 2.4, color = PAL.ink) {
    this.list = this.list.filter(b => b.target !== target);
    this.list.push({ target, text, t: dur, max: dur, color });
    if (target === 'pix' || (target && target.isPix)) AudioSys.sfx('pix');
  },
  clear() { this.list = []; },
  update(dt) { for (const b of this.list) b.t -= dt; this.list = this.list.filter(b => b.t > 0); },
  draw(g, camX, camY, resolve) {
    for (const b of this.list) {
      const tgt = typeof b.target === 'string' ? resolve(b.target) : b.target;
      if (!tgt) continue;
      const lines = wrapPlain(b.text, 150);

      // hueco libre más cercano encima del personaje (sin tapar HUD, avisos ni otros globos)

      let x = r.x, y = r.y;
      const pop = Math.min(1, (b.max - b.t) * 8);
      if (pop < 1) y += Math.round((1 - pop) * 4);
      const tgtY = tgt.y - camY, below = y > tgtY; // el globo quedó debajo: la cola apunta hacia arriba
      rect(g, x + 1, y, w - 2, h, '#FFF3D7'); rect(g, x, y + 1, w, h - 2, '#FFF3D7');
      strokeRect(g, x, y, w, h, '#10162B');

      if (!below) {
        rect(g, tx - 1, y + h, 3, 1, '#FFF3D7'); rect(g, tx, y + h + 1, 1, 2, '#FFF3D7');
        px(g, tx - 2, y + h, '#10162B'); px(g, tx + 2, y + h, '#10162B'); px(g, tx - 1, y + h + 1, '#10162B'); px(g, tx + 1, y + h + 1, '#10162B'); px(g, tx, y + h + 3, '#10162B');
      } else {
        rect(g, tx - 1, y - 1, 3, 1, '#FFF3D7'); rect(g, tx, y - 3, 1, 2, '#FFF3D7');
        px(g, tx - 2, y - 1, '#10162B'); px(g, tx + 2, y - 1, '#10162B'); px(g, tx - 1, y - 2, '#10162B'); px(g, tx + 1, y - 2, '#10162B'); px(g, tx, y - 4, '#10162B');
      }
      lines.forEach((l, i) => drawText(g, l, x + 4, y + 4 + i * 10, b.color));
    }
  }
};

// ---------- Corutinas de escena ----------
const Cut = {
  gen: null, cur: null, active: false, onEnd: null, stack: [],
  run(genFn, onEnd) {
    if (this.active) { this.stack.push({ genFn, onEnd }); return; }
    this.gen = genFn(); this.active = true; this.onEnd = onEnd || null;
    this.step(undefined);
  },
  step(val) {
    let guard = 0;
    while (guard++ < 1000) {
      let r;
      try { r = this.gen.next(val); } catch (e) { console.error(e); r = { done: true }; }
      if (r.done) { this.finish(); return; }
      const cmd = r.value;
      if (!cmd || typeof cmd.update !== 'function') { val = undefined; continue; }
      this.cur = cmd;
      if (cmd.start) cmd.start();
      if (cmd.instant) { val = cmd.result; this.cur = null; continue; }
      return;
    }
  },
  finish() {
    this.gen = null; this.cur = null; this.active = false; this.free = false; Dlg.close();
    const cb = this.onEnd; this.onEnd = null;
    if (cb) cb();
    if (!this.active && this.stack.length) { const n = this.stack.shift(); this.run(n.genFn, n.onEnd); }
  },
  update(dt) {
    if (!this.active || !this.cur) return;
    const done = this.cur.update(dt);
    if (done) { const v = this.cur.result; this.cur = null; this.step(v); }
  },
  draw(g) { if (this.cur && this.cur.draw) this.cur.draw(g); },
  abort() { this.gen = null; this.cur = null; this.active = false; this.free = false; this.stack = []; Dlg.close(); }
};

// Fábrica de comandos
const C = {
  say(who, text, expr) {
    return {
      start() { Dlg.open(who, text, expr); },
      update(dt) { const r = Dlg.update(dt); if (r && r.next) { Dlg.close(); return true; } return false; },
      draw(g) { Dlg.draw(g); }
    };
  },
  ask(who, text, options, expr) {
    const cmd = {
      result: 0,
      start() { Dlg.open(who, text, expr, options); },
      update(dt) { const r = Dlg.update(dt); if (r && r.choice != null) { cmd.result = r.choice; Dlg.close(); return true; } return false; },
      draw(g) { Dlg.draw(g); }
    };
    return cmd;
  },
  wait(t) { let e = 0; return { update(dt) { e += dt * (G.autoDialog ? 20 : 1); return e >= t; } }; },
  until(fn) { return { update() { return !!fn(); } }; },
  now(fn) { return { instant: true, start() { fn(); }, update() { return true; } }; },
  // devuelve el control a la jugadora hasta que se cumpla la condición
  play(fn) { return { start() { Cut.free = true; }, update() { const d = !!fn(); if (d) Cut.free = false; return d; } }; },
  all(cmds) {
    return {
      start() { cmds.forEach(c => c.start && c.start()); this.done = cmds.map(() => false); },
      update(dt) { cmds.forEach((c, i) => { if (!this.done[i]) this.done[i] = !!c.update(dt); }); return this.done.every(Boolean); },
      draw(g) { cmds.forEach(c => c.draw && c.draw(g)); }
    };
  },
  title(text, sub, dur = 3, color = PAL.sun) {
    let t = 0;
    return {
      update(dt) { t += dt * (G.autoDialog ? 20 : 1); if (t > 0.8 && (Input.hit('confirm') || Input.pointer.pressed)) { Input.consume(); t = Math.max(t, dur - 0.4); } return t >= dur; },
      draw(g) {
        const a = Math.min(1, t * 3, (dur - t) * 3);
        g.globalAlpha = clamp(a, 0, 1) * 0.75; rect(g, 0, 100, W, 64, '#10162B'); g.globalAlpha = clamp(a, 0, 1);
        rect(g, 0, 100, W, 1, color); rect(g, 0, 163, W, 1, color);
        drawText(g, text, W / 2, 114, color, { align: 'center', scale: 2, outline: '#10162B' });
        if (sub) drawText(g, sub, W / 2, 142, PAL.cream, { align: 'center' });
        g.globalAlpha = 1;
      }
    };
  },
  fade(to = 1, dur = 0.6, color = '#000000') {
    let t = 0; const from = Cut.fadeA || 0;
    return {
      start() { Cut.fadeColor = color; },
      update(dt) { t += dt; Cut.fadeA = lerp(from, to, clamp(t / dur, 0, 1)); return t >= dur; }
    };
  },
  flash(c = '#FFFFFF', a = 0.9) { return C.now(() => FX.flash(c, a)); },
  shake(m = 4, t = 0.4) { return C.now(() => FX.shake(m, t)); },
  sfx(n) { return C.now(() => AudioSys.sfx(n)); },
  music(n) { return C.now(() => AudioSys.playSong(n)); },
  // abre una escena encima y espera a que se cierre; el resultado es lo que devuelva la escena
  scene(makeScene) {
    const cmd = {
      result: null, done: false,
      start() { const s = makeScene(r => { cmd.result = r; cmd.done = true; }); Scenes.push(s); },
      update() { return cmd.done; }
    };
    return cmd;
  },
  ability(id) { return C.scene(done => new AbilityCardScene(id, done)); },
  concept(id) { return C.scene(done => new ConceptCardScene(id, done)); }
};
function* talk(lines) {
  for (const l of lines) {
    if (typeof l === 'function') { l(); continue; }
    if (l.ask) { const r = yield C.ask(l[0], l[1], l.ask, l[2]); if (l.then) l.then(r); continue; }
    yield C.say(l[0], l[1], l[2]);
  }
}

// ---------- Tarjeta de habilidad desbloqueada ----------
class AbilityCardScene {
  constructor(id, done) { this.id = id; this.done = done; this.t = 0; this.opaque = false; giveAbility(id); }
  update(dt) {
    this.t += dt;
    if (G.autoDialog) { Scenes.pop(); this.done(true); return; }
    if (this.t > 0.2 && this.t < 0.25) AudioSys.sfx('fanfare');
    if (this.t > 1 && (Input.hit('confirm') || Input.hit('interact') || Input.pointer.pressed)) { Input.consume(); Scenes.pop(); this.done(true); }
    if (Math.random() < 0.5) Particles.spawn({ x: rand(140, 340), y: rand(60, 200), vy: -20, life: 1, type: 'star', color: ABILITIES[this.id].color, screen: true });
  }
  draw(g) {
    const a = ABILITIES[this.id];
    const k = easeBack(clamp(this.t * 2, 0, 1));
    g.globalAlpha = Math.min(0.7, this.t * 2); rect(g, 0, 0, W, H, '#05070F'); g.globalAlpha = 1;
    const w = 280, h = 150, x = (W - w) / 2, y = (H - h) / 2 + (1 - k) * 60;
    panel(g, x, y, w, h, { border: a.color, accent: a.color, accentW: 60 });
    for (let r = 30; r > 8; r -= 6) pring(g, x + 40, y + 50, r + Math.sin(this.t * 4 + r) * 2, shade(a.color, -0.3 + r / 100));
    pcircle(g, x + 40, y + 50, 9, a.color); pcircle(g, x + 40, y + 50, 5, PAL.white);
    drawText(g, 'NUEVA HABILIDAD', x + 80, y + 14, PAL.cream);
    drawText(g, a.name, x + 80, y + 28, a.color, { scale: 2, outline: '#10162B' });
    drawText(g, 'Concepto: ' + a.concept, x + 80, y + 52, PAL.sun);
    drawPara(g, a.desc, x + 80, y + 66, w - 92, PAL.cream);
    if (a.key) keyHint(g, x + 16, y + h - 24, a.key, a.key === 'ability' ? 'usar (también cambia con R)' : 'activar', PAL.cream);
    drawText(g, 'Continuar ▶', x + w - 10, y + h - 20, PAL.lime, { align: 'right' });

  }
}

// ---------- Tarjeta de concepto (fase NOMBRAR del ciclo pedagógico) ----------

// =====================================================================
//  MUNDO: nivel, física de plataformas, jugadora, compañeros, cámara, HUD
// =====================================================================
const BG_CACHE = {};
function getBackground(theme) { return BG_CACHE[theme] || (BG_CACHE[theme] = buildBackground(theme)); }

const PHYS = {
  grav: 980, gravHold: 560, maxFall: 330, walk: 88, run: 138, accG: 1000, decG: 1500, accA: 720,
  jumpV: 258, coyote: 0.1, buffer: 0.13, climb: 62, waterGrav: 240, waterMax: 70, swimV: 150, glideFall: 34
};

// ---------------------------------------------------------------------
//  Interpolación de dibujo: la física avanza a 60 Hz fijos y el dibujo
//  mezcla el estado anterior y el actual según el tiempo sobrante.
// ---------------------------------------------------------------------
const Interp = {
  alpha: 1,
  objs(lv) { const o = [lv.player, lv.pix, lv.lumi]; if (lv.ghost) o.push(lv.ghost); for (const e of lv.entities) o.push(e); return o; },
  save() {
    const lv = G.run.level; if (!lv || !lv.player) return;
    for (const o of this.objs(lv)) { o._ix = o.x; o._iy = o.y; }
    lv.cam._ix = lv.cam.x; lv.cam._iy = lv.cam.y;
  },
  // aplica posiciones interpoladas; devuelve una función que las restaura
  apply(lv) {
    const a = this.alpha, saved = [];
    if (a >= 1) return () => { };
    const mix = o => {
      if (o._ix == null || typeof o.x !== 'number') return;
      const dx = o.x - o._ix, dy = o.y - o._iy;
      if (Math.abs(dx) > 40 || Math.abs(dy) > 40) return; // teletransporte: no interpolar
      saved.push([o, o.x, o.y]); o.x = o._ix + dx * a; o.y = o._iy + dy * a;
    };
    for (const o of this.objs(lv)) mix(o);
    mix(lv.cam);
    return () => { for (const [o, x, y] of saved) { o.x = x; o.y = y; } };
  }
};

class Level {
  constructor(key, spawnId) {
    const def = LEVELS[key];
    this.key = key; this.def = def; this.theme = THEMES[def.theme]; this.themeKey = def.theme;
    this.time = 0; this.lens = false; this.lensT = 0; this.weather = def.weather || 'clear'; this.weatherT = 0;
    this.entities = []; this.byId = {}; this.checkpoints = [];
    this.parse(def.map);
    this.bg = getBackground(def.theme);
    this.buildStatic();
    const start = this.findSpawn(spawnId);
    this.player = new Player(this, start.x, start.y);
    this.pix = new PixCompanion(this); this.lumi = new LumiCompanion(this);
    this.pix.x = start.x - 14; this.pix.y = start.y - 30; this.lumi.x = start.x + 6; this.lumi.y = start.y - 10;
    this.cam = { x: 0, y: 0, tx: null, ty: null, lock: false };
    this.snapCamera();
    this.enteredAt = Time.t; this.banner = 3.2;
    this.power = 0; this.updatePower(true);
    this.ghost = null; this.shake = 0;
    this.lastSafe = { x: start.x, y: start.y };
    if (def.init) def.init(this);
  }
  // ---------- mapa ----------
  parse(rows) {
    this.h = rows.length; this.w = Math.max(...rows.map(r => r.length));
    this.tiles = [];
    const counters = {};
    for (let y = 0; y < this.h; y++) {
      const row = [];
      for (let x = 0; x < this.w; x++) {
        let ch = rows[y][x] || '.';
        const px0 = x * TILE, py0 = y * TILE;
        const takeCfg = (k) => { counters[k] = (counters[k] || 0) + 1; const list = this.def[k]; return list ? list[counters[k] - 1] : null; };
        switch (ch) {
          case '@': this.spawn = { x: px0 + 3, y: py0 - 4 }; ch = '.'; break;
          case 'C': this.spawnEnt('C', px0, py0, {}, x, y); ch = '.'; break;
          case '*': { const cfg = takeCfg('chispas') || {}; this.addEntity(new Chispa(this, px0 + 4, py0 + 4, cfg)); ch = '.'; break; }
          case 'o': this.addEntity(new Seed(this, px0 + 5, py0 + 5, `${this.key}:${x},${y}`)); ch = '.'; break;
          case 'N': { const cfg = takeCfg('npcs'); if (cfg) this.addEntity(new NPC(this, px0, py0, cfg)); ch = '.'; break; }
          case 'T': { const cfg = takeCfg('terms'); if (cfg) this.addEntity(makeTerminal(this, px0, py0, cfg)); ch = '.'; break; }
          case 'E': { const cfg = takeCfg('enemies'); if (cfg) this.addEntity(makeEnemy(this, px0, py0, cfg)); ch = '.'; break; }
          case 'M': { const cfg = takeCfg('movers') || {}; this.addEntity(new Mover(this, px0, py0, cfg)); ch = '.'; break; }
          case 'P': { const cfg = takeCfg('plates') || {}; this.addEntity(new Plate(this, px0, py0, cfg)); ch = '.'; break; }
          case 'X': { const cfg = takeCfg('exits') || {}; this.addEntity(new Exit(this, px0, py0, cfg)); ch = '.'; break; }
          case 'S': { const cfg = takeCfg('vents') || {}; this.addEntity(new Vent(this, px0, py0, cfg)); ch = '.'; break; }
          case 'm': { const cfg = takeCfg('props'); if (cfg) this.addEntity(new Prop(this, px0, py0, cfg)); ch = '.'; break; }
          case 'i': { const cfg = takeCfg('items'); if (cfg) this.addEntity(new PackItem(this, px0 + 3, py0 + 4, cfg)); ch = '.'; break; }
          case 'L': this.addEntity(new Lamp(this, px0, py0)); ch = '.'; break;
          case 'a': this.addEntity(new Critter(this, px0, py0)); ch = '.'; break;
        }
        row.push(ch);
      }
      this.tiles.push(row);
    }
    // entidades declaradas con el constructor de mapas
    for (const en of (this.def.ents || [])) this.spawnEnt(en.t, en.x * TILE, en.y * TILE, en.cfg, en.x, en.y);
    if (this.def.spawnAt) this.spawn = { x: this.def.spawnAt[0] * TILE + 3, y: this.def.spawnAt[1] * TILE - 4 };
    if (!this.spawn) this.spawn = { x: 32, y: 32 };
    this.pw = this.w * TILE; this.ph = this.h * TILE;
  }
  addEntity(e) { this.entities.push(e); if (e.id) this.byId[e.id] = e; return e; }
  spawnEnt(t, px0, py0, cfg, x, y) {
    switch (t) {
      case 'C': { const c = new Checkpoint(this, px0, py0, this.checkpoints.length); this.checkpoints.push(c); return this.addEntity(c); }
      case '*': return this.addEntity(new Chispa(this, px0 + 4, py0 + 4, cfg));
      case 'o': return this.addEntity(new Seed(this, px0 + 5, py0 + 5, `${this.key}:${x},${y}`));
      case 'N': return this.addEntity(new NPC(this, px0, py0, cfg));
      case 'T': return this.addEntity(makeTerminal(this, px0, py0, cfg));
      case 'E': return this.addEntity(makeEnemy(this, px0, py0, cfg));
      case 'M': return this.addEntity(new Mover(this, px0, py0, cfg));
      case 'P': return this.addEntity(new Plate(this, px0, py0, cfg));
      case 'X': return this.addEntity(new Exit(this, px0, py0, cfg));
      case 'S': return this.addEntity(new Vent(this, px0, py0, cfg));
      case 'm': return this.addEntity(new Prop(this, px0, py0, cfg));
      case 'i': return this.addEntity(new PackItem(this, px0 + 3, py0 + 4, cfg));
      case 'L': return this.addEntity(new Lamp(this, px0, py0));
      case 'a': return this.addEntity(new Critter(this, px0, py0));
      case 'B': return this.addEntity(new Boss(this, px0, py0, cfg));
    }
  }
  get(id) { return this.byId[id]; }
  findSpawn(spawnId) {
    if (spawnId === 'checkpoint' && G.save.checkpoint && G.save.checkpoint.level === this.key) {
      const cp = this.checkpoints[G.save.checkpoint.idx];
      if (cp) { cp.active = true; return { x: cp.x + 3, y: cp.y - 4 }; }
    }
    if (spawnId && this.def.spawns && this.def.spawns[spawnId]) { const s = this.def.spawns[spawnId]; return { x: s[0] * TILE + 3, y: s[1] * TILE - 4 }; }
    return this.spawn;
  }
  tile(tx, ty) {
    if (tx < 0 || tx >= this.w) return '#';
    if (ty < 0) return '.';
    if (ty >= this.h) return '.';
    return this.tiles[ty][tx];
  }
  dyn(ch) { return (this.def.dyn && this.def.dyn[ch]) || DEFAULT_DYN[ch]; }
  solidAt(tx, ty) {
    const t = this.tile(tx, ty);
    if (t === '#') return true;
    const d = this.dyn(t);
    if (d && d.solid) return !!d.solid(this);
    return false;
  }
  oneWayAt(tx, ty) {
    const t = this.tile(tx, ty);
    if (t === '=') return true;
    if ((t === 'H' || t === '|') && this.tile(tx, ty - 1) !== t) return true;
    const d = this.dyn(t);
    return !!(d && d.oneWay && d.oneWay(this));
  }
  // ---------- pre-render del terreno estático ----------
  buildStatic() {
    const c = makeCanvas(this.pw, this.ph), g = c.g, th = this.theme;
    const rng = mulberry32(hashStr(this.key + 'tiles'));
    const solid = (x, y) => { const t = this.tile(x, y); return t === '#' || (y >= this.h && t !== '.'); };
    const decoSpots = [];
    this.paintSupports(g, th);
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const t = this.tiles[y][x];
      if (t === '#') {
        const m = (solid(x, y - 1) || y === 0 ? 1 : 0) | (solid(x, y + 1) || y === this.h - 1 ? 2 : 0) | (solid(x - 1, y) ? 4 : 0) | (solid(x + 1, y) ? 8 : 0);
        paintSolidTile(g, x * TILE, y * TILE, m, th, rng);
        if (!(m & 1) && y > 0 && this.tiles[y - 1][x] === '.') decoSpots.push([x, y]);
      } else if (t === '~') {
        // fondo del agua opaco: el paisaje lejano no se ve «a través» del estanque
        const top = y > 0 && this.tiles[y - 1][x] !== '~';
        rect(g, x * TILE, y * TILE, 16, 16, shade(th.water[0], top ? -0.2 : -0.38));
        if (rng() < 0.3) rect(g, x * TILE + randi(2, 12), y * TILE + randi(4, 13), 2, 1, shade(th.water[0], -0.5));
      } else if (t === '=') paintPlatform(g, x * TILE, y * TILE, th.plat, th);
      else if (t === 'H') paintLadder(g, x * TILE, y * TILE);
      else if (t === '|') paintRope(g, x * TILE, y * TILE);
    }
    for (const [x, y] of decoSpots) if (rng() < 0.42 && th.ground.deco.length) drawDeco(g, choice(th.ground.deco), x * TILE, y * TILE, rng, th);
    this.staticCv = c;
  }
  // Postes bajo las plataformas de madera, metal o piedra (o cuerdas desde arriba):
  // así no parecen flotar sin motivo. Nubes, cristales, neón y prismas sí flotan.
  paintSupports(g, th) {
    const style = th.plat;
    const post = { wood: ['#6B4A2A', '#8B5A3C', 2], metal: ['#565E8C', '#8A96C8', 2], stone: ['#C8BFD8', '#EDE6F5', 3], glass: ['#8A8FB0', '#C9D2F0', 1] }[style];
    if (!post) return;
    const empty = t => t === '.' || t === '~' || t === 'H' || t === '|' || t === '^';
    for (let y = 0; y < this.h; y++) {
      let x = 0;
      while (x < this.w) {
        if (this.tiles[y][x] !== '=') { x++; continue; }
        let x2 = x; while (x2 + 1 < this.w && this.tiles[y][x2 + 1] === '=') x2++;
        const cols = x2 - x >= 5 ? [x, Math.floor((x + x2) / 2), x2] : x2 > x ? [x, x2] : [x];
        for (const tx of cols) {
          const px0 = tx * TILE + (tx === x2 && tx !== x ? 11 : 3);
          // buscar apoyo hacia abajo
          let d = 1, ok = false;
          while (y + d < this.h && d <= 9) { const t = this.tiles[y + d][tx]; if (t === '#' || t === '=') { ok = true; break; } if (!empty(t)) break; d++; }
          if (!ok && y + d >= this.h) ok = d <= 9;
          if (ok && d > 1) {
            const top = y * TILE + 5, bot = (y + d) * TILE;
            rect(g, px0, top, post[2], bot - top, post[0]); rect(g, px0, top, 1, bot - top, post[1]);
            if (bot - top > 40) { rect(g, px0 - 1, top + 3, post[2] + 2, 1, post[0]); }
            continue;
          }
          // colgar de una cuerda si hay techo cerca
          let u = 1; while (y - u >= 0 && u <= 6 && this.tiles[y - u][tx] !== '#') u++;
          if (y - u >= 0 && u <= 6 && style === 'wood') { for (let yy = (y - u + 1) * TILE; yy < y * TILE; yy += 2) px(g, px0, yy, '#C8A070'); }
        }
        x = x2 + 1;
      }
    }
  }
  // ---------- energía por zonas ----------
  updatePower(silent) {
    const zones = this.def.zones || [];
    if (!zones.length) { this.power = this.def.restoredFlag && flag(this.def.restoredFlag) ? 1 : (this.def.basePower != null ? this.def.basePower : 1); return; }
    const on = zones.filter(z => flag(z.flag)).length;
    this.power = on / zones.length;
  }
  zonePowered(px0) {
    const zones = this.def.zones || [];
    if (!zones.length) return this.power >= 1;
    const tx = px0 / TILE;
    for (const z of zones) if (tx >= z.x0 && tx < z.x1) return flag(z.flag);
    return this.power >= 1;
  }
  darkness() {
    const base = this.def.dark != null ? this.def.dark : this.theme.dark;
    let d = base * (1 - this.power * 0.85);
    if (this.weather === 'storm' || this.weather === 'rain') d += 0.15;
    if (this.weather === 'dust') d += 0.1;
    if (this.def.forceDark != null) d = this.def.forceDark;
    if (this.forceDark != null) d = this.forceDark;
    return clamp(d, 0, 0.85);
  }
  // ---------- cámara ----------
  snapCamera() {
    const p = this.player;
    this.cam.x = clamp(p.x + p.w / 2 - W / 2, 0, Math.max(0, this.pw - W));
    this.cam.y = clamp(p.y + p.h / 2 - H / 2 - 10, 0, Math.max(0, this.ph - H));
  }
  updateCamera(dt) {
    const p = this.player;
    let tx, ty;
    if (this.cam.tx != null) { tx = this.cam.tx - W / 2; ty = this.cam.ty - H / 2; }
    else {
      tx = p.x + p.w / 2 - W / 2 + p.face * 34 + p.vx * 0.15;
      ty = p.y + p.h / 2 - H / 2 - 12;
      if (p.onGround) this.camGroundY = ty;
      else if (this.camGroundY != null && Math.abs(ty - this.camGroundY) < 40 && p.vy < 0) ty = this.camGroundY;
    }
    tx = clamp(tx, 0, Math.max(0, this.pw - W)); ty = clamp(ty, 0, Math.max(0, this.ph - H));
    const k = this.cam.tx != null ? 2.5 : 6;
    this.cam.x = lerp(this.cam.x, tx, Math.min(1, k * dt));
    this.cam.y = lerp(this.cam.y, ty, Math.min(1, (k + 2) * dt));
  }
  // ---------- actualización ----------
  update(dt) {
    this.time += dt;
    this.banner = Math.max(0, this.banner - dt);
    const control = (!Cut.active || Cut.free) && !this.frozen;
    // lente debug
    if (control && Input.hit('lens') && hasAbility('lens')) { this.lens = !this.lens; AudioSys.sfx(this.lens ? 'debug' : 'click'); }
    this.lensT = approach(this.lensT, this.lens ? 1 : 0, dt * 5);
    this.player.update(dt, control);
    for (const e of this.entities) if (!e.dead && e.update) e.update(dt);
    this.entities = this.entities.filter(e => !e.dead || e.keep);
    if (this.ghost) { this.ghost.update(dt); if (this.ghost.done) this.ghost = null; }
    this.pix.update(dt); this.lumi.update(dt);
    // interacción
    this.nearby = null;
    if (control) {
      let best = null, bd = 1e9;
      for (const e of this.entities) {
        if (!e.canInteract || !e.canInteract()) continue;
        const r = e.interactRect ? e.interactRect() : { x: e.x - 8, y: e.y - 8, w: e.w + 16, h: e.h + 16 };
        if (rectHit(this.player, r)) { const d = Math.abs(e.x + e.w / 2 - this.player.x - this.player.w / 2); if (d < bd) { bd = d; best = e; } }
      }
      this.nearby = best;
      if (best && Input.hit('interact')) { Input.consume(); this.player.anim = 'interact'; this.player.animT = 0.3; best.interact(); }
    }
    // disparadores
    if (this.def.triggers) for (const tr of this.def.triggers) {
      if (tr.done || (tr.flag && flag(tr.flag))) continue;
      if (tr.cond && !tr.cond(this)) continue;
      const r = { x: tr.x * TILE, y: (tr.y || 0) * TILE, w: (tr.w || 1) * TILE, h: (tr.h || this.h) * TILE };
      if (rectHit(this.player, r) && !Cut.active) {
        if (tr.once !== false) tr.done = true;
        if (tr.flag) setFlag(tr.flag);
        if (tr.run) Cut.run(() => tr.run(this));
        if (tr.fn) tr.fn(this);
      }
    }
    if (this.def.update) this.def.update(this, dt);
    this.updateCamera(dt);
    // clima
    this.updateWeather(dt);
    // partículas ambientales
    this.ambientParticles(dt);
    Bark.update(dt);
  }
  updateWeather(dt) {
    const w = this.weather;
    if (w === 'rain' || w === 'storm') {
      for (let i = 0; i < (w === 'storm' ? 6 : 3); i++) Particles.spawn({ x: rand(-20, W + 40), y: -5, vx: -60, vy: rand(280, 360), life: 1, type: 'rain', color: 'rgba(200,230,255,0.7)', screen: true, drag: 1, layer: 1 });
      if (w === 'storm' && Math.random() < 0.004) { FX.flash('#FFFFFF', 0.5); AudioSys.sfx('boom'); }
    } else if (w === 'dust') {
      for (let i = 0; i < 4; i++) Particles.spawn({ x: W + 5, y: rand(0, H), vx: rand(-260, -160), vy: rand(-10, 10), life: 2.5, type: 'fade', size: 2, color: choice(['#E8B870', '#D09850', '#F0D0A0']), screen: true, drag: 1, layer: 1 });
    } else if (w === 'wind') {
      if (Math.random() < 0.3) Particles.spawn({ x: -5, y: rand(10, H - 60), vx: rand(160, 260), vy: 0, life: 2.2, type: 'fade', size: 1, color: 'rgba(255,255,255,0.8)', screen: true, drag: 1, layer: 1 });
    }
  }
  ambientParticles(dt) {
    const type = this.theme.particles, cx = this.cam.x, cy = this.cam.y;
    const r = Math.random();
    switch (type) {
      case 'fireflies': if (r < 0.06) Particles.spawn({ x: cx + rand(0, W), y: cy + rand(40, H - 40), vx: rand(-8, 8), vy: rand(-8, 4), life: rand(2, 4), type: 'star', color: choice([PAL.sun, PAL.lime]), wob: 10, drag: 1 }); break;
      case 'pollen': if (r < 0.08) Particles.spawn({ x: cx + rand(0, W), y: cy + rand(0, H), vx: rand(5, 20), vy: rand(-5, 5), life: 3, type: 'dot', color: choice(['#FFF3A0', '#FFFFFF', '#FFD84A']), wob: 8, drag: 1 }); break;
      case 'glints': if (r < 0.07) Particles.spawn({ x: cx + rand(0, W), y: cy + rand(0, H), life: 0.6, type: 'spark', color: PAL.sun, drag: 1 }); break;
      case 'wind': if (r < 0.1) Particles.spawn({ x: cx - 4, y: cy + rand(0, H), vx: rand(60, 140), vy: rand(-6, 6), life: 5, type: 'leaf', color: choice(['#9CF5D8', '#FFFFFF', '#FF7FCF']), wob: 12, drag: 1 }); break;
      case 'mist': if (r < 0.1) Particles.spawn({ x: cx + rand(0, W), y: cy + H + 2, vx: rand(-6, 6), vy: rand(-18, -8), life: 5, type: 'bubble', size: 1, color: '#DFFBFF', wob: 6, drag: 1 }); break;

  }
  update(dt, control) {

    this.frameT += dt; this.inv = Math.max(0, this.inv - dt); this.animT = Math.max(0, this.animT - dt); this.landT = Math.max(0, this.landT - dt);

    const hb = { x: this.x + 2, y: this.y + 6, w: this.w - 4, h: this.h - 6 };
    const x0 = Math.floor(hb.x / TILE), x1 = Math.floor((hb.x + hb.w) / TILE), y0 = Math.floor(hb.y / TILE), y1 = Math.floor((hb.y + hb.h) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const t = lv.tile(tx, ty);
      if (t === '^') { const r = { x: tx * TILE + 1, y: ty * TILE + 8, w: 14, h: 8 }; if (rectHit(hb, r)) { this.hurt(); return; } }
      const d = lv.dyn(t);
      if (d && d.hazard && d.hazard(lv)) { this.hurt(); return; }
    }
  }
  // ---------- habilidades ----------
  updateAbility(dt) {
    const lv = this.lv;
    const owned = ABILITY_ORDER.filter(a => hasAbility(a));
    if (Input.hit('swap') && owned.length > 1) {
      const i = owned.indexOf(G.save.currentAbility);
      G.save.currentAbility = owned[(i + 1) % owned.length];
      AudioSys.sfx('select'); Toast.show('Habilidad: ' + ABILITIES[G.save.currentAbility].name, ABILITIES[G.save.currentAbility].color, 1.4);
    }
    const ab = G.save.currentAbility;
    // escudo condicional: se evalúa en cada frame
    this.shieldOn = false;
    if (this.shieldArmed && hasAbility('shield')) {
      const cond = this.shieldCondition();
      if (cond && this.energy > 0) { this.shieldOn = true; this.energy -= (this.shieldRule === 1 ? 45 : 30) * dt; if (this.energy <= 0) { this.energy = 0; this.shieldArmed = false; Bark.say('pix', 'Escudo sin energía. ¿Quizás la condición era demasiado amplia?'); } }
    }
    if (!this.shieldOn) this.energy = Math.min(100, this.energy + (lv.power > 0.3 ? 18 : 10) * dt);
    if (Input.hit('ability') && ab) {
      if (lv.def.abilityHook && lv.def.abilityHook(lv, ab)) return;
      switch (ab) {
        case 'spark': if (!lv.ghost || lv.ghost.done) Scenes.push(new SparkEditorScene(lv)); else Bark.say('pix', 'Espera a que termine el eco actual.'); break;
        case 'shield':
          if (this.shieldArmed && this.shieldHoldT === undefined) { }
          Scenes.push(new ShieldRuleScene(this)); break;
        case 'glide': Bark.say('pix', 'MIENTRAS mantengas SALTO en el aire: planear. ¡Un bucle con condición!'); break;
        case 'dash':
          if (this.energy >= 20) {
            this.energy -= 20; this.dashT = 0.2; this.dashDir = this.face; this.inv = Math.max(this.inv, 0.25); AudioSys.sfx('dash');
            const tgt = lv.entities.filter(e => e.priority != null && !e.dead && Math.abs(e.y - this.y) < 40 && (e.x - this.x) * this.face > 0 && Math.abs(e.x - this.x) < 110).sort((a, b) => b.priority - a.priority)[0];
            if (tgt) { this.dashDir = sign(tgt.x - this.x) || this.face; Particles.text(tgt.x + 4, tgt.y - 6, 'PRIORIDAD ' + tgt.priority, PAL.pink); }
          } else Bark.say('pix', 'Energía insuficiente para el Dash. Recarga cerca de la luz.');
          break;
        default: {
          // habilidades contextuales: portal, estados, pipeline, pack
          const tgt = lv.entities.find(e => e.onAbility && !e.dead && rectHit(this, { x: e.x - 24, y: e.y - 24, w: e.w + 48, h: e.h + 48 }));
          if (tgt) { this.anim = 'ability'; this.animT = 0.35; tgt.onAbility(ab, this); }
          else if (ab === 'pack') { const items = G.save.pack || []; Bark.say('pix', items.length ? 'mochila = [' + items.map(i => i.name).join(', ') + ']' : 'mochila = [ ]  (lista vacía)'); }
          else Bark.say('pix', ABILITIES[ab].name + ': no hay nada con qué usarla aquí.');
        }
      }
    }
  }
  shieldCondition() {
    const lv = this.lv;
    if (this.shieldRule === 1) return true; // SIEMPRE
    if (this.shieldRule === 2) return !this.onGround; // SI saltando
    if (lv.boss && lv.boss.ringNear(this.cx, this.y + 10, 22)) return true;
    // SI peligro_cerca
    const R = 26;
    for (const e of lv.entities) if (e.hostile && !e.dead && dist(e.x + e.w / 2, e.y + e.h / 2, this.cx, this.y + 10) < R + 10) return true;
    const x0 = Math.floor((this.x - R) / TILE), x1 = Math.floor((this.x + this.w + R) / TILE), y0 = Math.floor((this.y - R / 2) / TILE), y1 = Math.floor((this.y + this.h + R / 2) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) { const t = lv.tile(tx, ty); if (t === '^') return true; const d = lv.dyn(t); if (d && d.hazard && d.hazard(lv)) return true; }
    return false;
  }
  post(dt) {
    // animación
    if (this.animT > 0 && ['interact', 'hurt', 'ability', 'program', 'celebrate', 'surprise'].includes(this.anim)) { }
    else if (this.celebrateT > 0) { this.celebrateT -= dt; this.anim = 'celebrate'; }
    else if (this.climbing) this.anim = 'climb';
    else if (this.inWater) this.anim = 'swim';
    else if (this.gliding) this.anim = 'glide';
    else if (!this.onGround) this.anim = this.vy < 0 ? 'jump' : 'fall';
    else if (this.landT > 0) this.anim = 'land';
    else if (Math.abs(this.vx) > 100) this.anim = 'run';
    else if (Math.abs(this.vx) > 8) this.anim = 'walk';
    else this.anim = this.forceAnim || 'idle';
    // reloj de animación: se reinicia al cambiar de animación y avanza según la velocidad real
    if (this.anim !== this.lastAnim) { this.lastAnim = this.anim; this.animClock = 0; }
    const sp = Math.abs(this.vx);
    const rate = this.anim === 'walk' ? clamp(sp / PHYS.walk, 0.45, 1.3) : this.anim === 'run' ? clamp(sp / PHYS.run, 0.6, 1.2) : this.anim === 'climb' ? (this.vy !== 0 ? 1 : 0) : this.anim === 'swim' ? (Math.abs(this.vx) + Math.abs(this.vy) > 10 ? 1 : 0.5) : 1;
    this.animClock = (this.animClock || 0) + dt * rate;
    // parpadeo natural: cada 2,5–5,5 s, dura 0,13 s
    this.blinkT = (this.blinkT == null ? 3 : this.blinkT) - dt;
    if (this.blinkT < -0.13) this.blinkT = rand(2.5, 5.5);
    if (this.onGround && Math.abs(this.vx) > 8) { this.stepT += dt * Math.abs(this.vx) / 60; if (this.stepT > 0.5) { this.stepT = 0; AudioSys.sfx('step'); } }
    if (this.onGround && Math.abs(this.vx) < 5 && !Cut.active) this.idleT += dt; else this.idleT = 0;
    if (this.onGround && !this.inWater) this.lv.lastSafe = { x: this.x, y: this.y };
  }
  draw(g, cx, cy) {
    if (this.inv > 0 && Math.floor(this.inv * 15) % 2 === 0) return;
    const A = Spr.lia[this.anim] || Spr.lia.idle;
    const fps = { walk: 11, run: 14, climb: 6, swim: 4, interact: 8, program: 5, celebrate: 4 }[this.anim] || 8;
    const t = this.animClock || 0;
    let f;
    if (this.anim === 'idle' || !Spr.lia[this.anim]) {
      // respiración lenta (ciclo de 2,4 s) + parpadeo ocasional
      const breath = (t % 2.4) > 1.3 ? 1 : 0;
      f = (this.blinkT < 0 ? 2 : 0) + breath;
    } else f = Math.floor(t * fps) % A.length;
    const fr = this.face > 0 ? A[f].r : A[f].l;
    const dx = Math.round(this.x + this.w / 2 - fr.width / 2 - cx), dy = Math.round(this.y + this.h - fr.height + 1 - cy);
    g.drawImage(fr, dx, dy);
    if (this.shieldOn || this.shieldArmed) {
      const r = 15, sx = this.cx - cx, sy = this.y + 10 - cy;
      if (this.shieldOn) { g.globalAlpha = 0.5 + Math.sin(this.lv.time * 20) * 0.2; pring(g, sx, sy, r, PAL.orange); pring(g, sx, sy, r - 1, PAL.sun); g.globalAlpha = 0.15; pcircle(g, sx, sy, r - 2, PAL.sun); g.globalAlpha = 1; }
      else { g.globalAlpha = 0.25; pring(g, sx, sy, r, PAL.orange); g.globalAlpha = 1; }
    }
  }
}

class PixCompanion {
  constructor(lv) { this.lv = lv; this.x = 0; this.y = 0; this.w = 12; this.h = 9; this.face = 1; this.t = 0; this.isPix = true; this.bonkT = 0; this.quipT = 12 + Math.random() * 10; this.target = null; this.hidden = false; this.override = null; }
  bonkChance() {
    if (this.bonkT > 0 || Cut.active || flag('pixQuiet') && !flag('pixHealed')) return;
    this.bonkT = 2.2; AudioSys.sfx('bonk');
    Particles.burst(this.x + 6, this.y + 4, 6, { color: PAL.sun, min: 20, max: 50, type: 'star' });
    Bark.say('pix', choice(['¡Eso fue completamente intencional!', 'Totalmente planeado. Estaba midiendo la pared.', '¡Intencional! 100% intencional.']));
  }
  update(dt) {
    this.t += dt; this.bonkT = Math.max(0, this.bonkT - dt);
    const p = this.lv.player;
    let tx, ty;
    if (this.override) { tx = this.override.x; ty = this.override.y; }
    else if (this.target && !this.target.dead) { tx = this.target.x + (this.target.w || 16) / 2 - 6; ty = this.target.y - 22; }
    else { tx = p.cx - 6 - p.face * 16; ty = p.y - 20; }
    const quiet = flag('pixQuiet') && !flag('pixHealed');
    const hover = Math.sin(this.t * (quiet ? 2 : 4)) * (quiet ? 1.5 : 3);
    if (this.bonkT > 1.7) { ty += 6; }
    this.x = lerp(this.x, tx, Math.min(1, dt * (quiet ? 3 : 5)));
    this.y = lerp(this.y, ty + hover, Math.min(1, dt * 5));
    // girar solo con un margen claro (evita que PÍX parpadee de lado a lado)
    const dx = tx - this.x; if (Math.abs(dx) > 4) this.face = dx > 0 ? 1 : -1; else if (Math.abs(dx) < 1.5 && Math.abs(p.vx) < 5) this.face = p.face;
    // comentarios espontáneos
    if (!Cut.active && !quiet) {
      this.quipT -= dt;
      if (this.quipT <= 0) { this.quipT = 18 + Math.random() * 16; const q = this.lv.def.quips; const text = typeof q === 'function' ? q(this.lv) : (q && q.length ? choice(q) : null); if (text) Bark.say('pix', text, 3); }
    }
    // señalar interactivos cuando Lía está quieta
    if (this.lv.player.idleT > 5 && !this.target && this.lv.def.pointAt) { const e = this.lv.get(this.lv.def.pointAt(this.lv)); if (e && !e.dead) this.target = e; }
    if (this.lv.player.idleT < 1) this.target = null;
  }
  draw(g, cx, cy) {
    if (this.hidden) return;
    const quiet = flag('pixQuiet') && !flag('pixHealed');
    const set = quiet ? Spr.pixQuiet : Spr.pix;
    const f = Math.floor(this.t * (quiet ? 10 : 18)) % 4;
    const fr = this.face > 0 ? set[f].r : set[f].l;
    const x = Math.round(this.x - cx), y = Math.round(this.y - cy);
    g.drawImage(fr, x, y);
    if (flag('pixHealed') && Math.random() < 0.2) Particles.spawn({ x: this.x + 6, y: this.y + 10, vy: 10, life: 0.5, type: 'dot', color: hsl(Time.t * 200, 90, 70) });
    if (this.bonkT > 1.2) { for (let i = 0; i < 3; i++) { const a = this.t * 8 + i * 2.1; px(g, x + 7 + Math.cos(a) * 6, y - 2 + Math.sin(a) * 2, PAL.sun); } }
    if (this.lv.lensT > 0.5 && flag('pixFragment')) { drawText(g, 'fragmento_predictivo', x - 30, y - 10, PAL.pink); }
  }
}

class LumiCompanion {
  constructor(lv) { this.lv = lv; this.x = 0; this.y = 0; this.w = 7; this.h = 7; this.t = 0; this.mood = 'n'; this.moodT = 0; this.glow = 0.5; this.color = PAL.sun; this.stay = null; this.hidden = false; }
  update(dt) {
    this.t += dt; this.moodT = Math.max(0, this.moodT - dt);
    const p = this.lv.player;
    if (this.moodT <= 0) this.mood = flag('lumiSad') ? 'sad' : this.lv.power >= 1 ? 'happy' : this.lv.darkness() > 0.45 ? 'fear' : 'n';
    let tx = p.cx + p.face * 10 - 3, ty = p.y + 2;
    if (this.stay) { tx = this.stay.x; ty = this.stay.y; }
    // flotación suave; con miedo se acerca a Lía y se estremece de vez en cuando (no todo el tiempo)
    const shiver = this.mood === 'fear' && (this.t % 3) < 0.35 ? Math.sin(this.t * 22) * 1 : 0;
    const bounce = this.mood === 'happy' ? -Math.abs(Math.sin(this.t * 3.2)) * 5 : this.mood === 'fear' ? Math.sin(this.t * 2) * 1 + shiver : Math.sin(this.t * 2.2) * 2;
    if (this.mood === 'fear' && !this.stay) { tx = p.cx + p.face * 6 - 3; ty = p.y + 4; }
    this.x = lerp(this.x, tx, Math.min(1, dt * 4));
    this.y = lerp(this.y, ty + bounce, Math.min(1, dt * 6));
    const e = p.energy / 100, c = p.cells / p.maxCells;
    const base = this.lv.power;
    this.glow = clamp(0.35 + base * 0.4 + e * 0.25, 0.2, 1.1);
    this.color = this.mood === 'fear' ? PAL.sky : this.mood === 'sad' ? '#7C86C8' : this.mood === 'happy' ? PAL.sun : c < 0.5 ? PAL.coral : PAL.sun;
    if (flag('lumiPrism')) this.color = hsl(this.t * 90, 90, 70);
    if (Math.random() < 0.15 * this.glow) Particles.spawn({ x: this.x + 3, y: this.y + 3, vx: rand(-6, 6), vy: rand(-12, -2), life: 0.6, type: 'dot', color: this.color });
  }
  draw(g, cx, cy) {
    if (this.hidden) return;
    const x = Math.round(this.x - cx), y = Math.round(this.y - cy);
    const shapeI = this.mood === 'fear' ? 1 : this.mood === 'happy' ? Math.floor(this.t * 2.5) % 2 * 2 : 0;
    g.globalAlpha = 0.25; pcircle(g, x + 3, y + 3, 5 + Math.round(this.glow * 3), this.color); g.globalAlpha = 1;
    drawLumiShape(g, x, y, Spr.lumi[shapeI], this.color, shade(this.color, -0.25), true, this.mood === 'happy' ? 'happy' : this.mood === 'sad' ? 'sleep' : 'n');
  }
}

// ---------- utilidades de nivel ----------
Level.prototype.gameOver = function () {
  const lv = this;
  lv.frozen = true;
  Cut.run(function* () {
    yield C.title('La red perdió estabilidad.', 'Recalculando ruta...', 2.4, PAL.coral);
    lv.respawn();
    lv.frozen = false;
  });
};
Level.prototype.fellOut = function () {
  const p = this.player;
  const cp = this.checkpoints.find(c => c.active);
  const s = this.lastSafe && !this.lastSafeBad ? this.lastSafe : cp ? { x: cp.x + 3, y: cp.y - 4 } : this.spawn;
  p.x = s.x; p.y = s.y; p.vx = 0; p.vy = 0; p.inv = 1;
  p.cells = Math.max(1, p.cells - 1);
  this.snapCamera();
  Bark.say('pix', choice(['Técnicamente descendimos.', 'Bajada no planificada. Recalculando.', 'Eso fue una caída libre educativa.']));
};
Level.prototype.respawn = function () {
  const p = this.player;
  const cp = this.checkpoints.filter(c => c.active).pop();
  const s = cp ? { x: cp.x + 3, y: cp.y - 4 } : this.spawn;
  p.x = s.x; p.y = s.y; p.vx = p.vy = 0; p.cells = p.maxCells; p.inv = 1.5; p.energy = 100;
  this.snapCamera();
  Particles.burst(p.cx, p.y + 10, 20, { colors: [PAL.sun, PAL.teal], min: 20, max: 60 });
};

// ---------- Criaturas ambientales (vida del mundo) ----------
class Critter extends Entity {
  constructor(lv, x, y) {
    super(lv, x, y + 10, 6, 6);
    const th = lv.themeKey;
    this.kind = { festival: 'cat', puerto: 'crab', valle: 'bunny', solaria: 'bird', aeris: 'bird', hydria: 'frog', bioloop: 'frog', gea: 'bat', h2: 'crab', bateria: 'cat', prisma: 'bunny', faro: 'bird' }[th] || 'bird';
    this.ox = x; this.oy = this.y; this.dir = Math.random() < 0.5 ? 1 : -1; this.hop = 0; this.flee = 0;
    this.mode = 'idle'; this.modeT = rand(0.5, 2.5); this.fly = 0; this.alpha = 1;
  }
  // comportamiento sencillo pero natural: pausa → paseo corto → pausa; huye si Lía se acerca
  update(dt) {
    super.update(dt);
    const p = this.lv.player, k = this.kind;
    const d = Math.abs(p.cx - this.x) + Math.abs(p.y + 10 - this.y) * 0.5;
    const flier = k === 'bird' || k === 'bat';
    if (d < 38 && this.mode !== 'flee' && this.mode !== 'away') { this.mode = 'flee'; this.modeT = flier ? 1.6 : 1.1; this.dir = p.cx < this.x ? 1 : -1; }
    this.modeT -= dt;

    g.drawImage(fr, Math.round(this.x + this.w / 2 - fr.width / 2 - cx), Math.round(this.y + this.h - fr.height + 1 - cy));

// ---------- Eco de Step Spark ----------
class SparkGhost {
  constructor(lv, x, y, face, seq) {
    this.lv = lv; this.x = x; this.y = y; this.w = 10; this.h = 20; this.vx = 0; this.vy = 0; this.face = face; this.onGround = false;
    this.seq = seq; this.i = -1; this.stepT = 0; this.hold = 5; this.done = false; this.t = 0; this.jumped = false; this.log = [];
    this.next();
  }
  next() {
    this.i++; this.stepT = 0; this.jumped = false;
    if (this.i < this.seq.length) { AudioSys.sfx('tick', this.i); Particles.text(this.x + 5, this.y - 8, (this.i + 1) + ': ' + SPARK_OPS[this.seq[this.i]].label, PAL.sun); }
  }
  update(dt) {
    this.t += dt;
    const op = this.i < this.seq.length ? this.seq[this.i] : null;
    let ax = 0;
    if (op) {
      this.stepT += dt;
      const o = SPARK_OPS[op];
      ax = o.dx;
      if (o.jump && !this.jumped && this.onGround) { this.vy = -PHYS.jumpV; this.jumped = true; }
      if (op === 'act') { const tgt = this.lv.entities.find(e => e.onSpark && rectHit(this, { x: e.x - 6, y: e.y - 6, w: e.w + 12, h: e.h + 12 })); if (tgt && !this.acted) { this.acted = true; tgt.onSpark(this); } }
      if (this.stepT >= o.dur && (this.onGround || this.stepT > 1.2)) { this.acted = false; this.next(); }
    } else { this.hold -= dt; if (this.hold <= 0) { this.done = true; Particles.burst(this.x + 5, this.y + 10, 16, { color: PAL.sun, min: 20, max: 60 }); } }
    if (ax) this.face = ax;
    this.vx = ax * PHYS.walk;
    this.vy = Math.min(this.vy + (this.vy < 0 ? PHYS.gravHold : PHYS.grav) * dt, PHYS.maxFall);
    // movimiento y colisiones (reutiliza la física de la jugadora)
    Player.prototype.moveX.call(this, this.vx * dt);
    Player.prototype.moveY.call(this, this.vy * dt);
    if (this.y > this.lv.ph) this.done = true;
    if (Math.random() < 0.4) Particles.spawn({ x: this.x + rand(0, 10), y: this.y + rand(0, 20), vy: -10, life: 0.4, type: 'dot', color: PAL.sun });
  }
  get cx() { return this.x + this.w / 2; }
  draw(g, cx, cy) {
    const a = !this.onGround ? (this.vy < 0 ? 'jump' : 'fall') : Math.abs(this.vx) > 5 ? 'walk' : 'idle';
    const A = Spr.liaGhost[a]; const f = Math.floor(this.t * 9) % A.length;
    const fr = this.face > 0 ? A[f].r : A[f].l;
    g.globalAlpha = 0.6 + Math.sin(this.t * 10) * 0.2;
    g.drawImage(fr, Math.round(this.x + 5 - fr.width / 2 - cx), Math.round(this.y + 21 - fr.height - cy));
    g.globalAlpha = 1;
  }
}

// ---------- Enemigos conceptuales ----------
function makeEnemy(lv, x, y, cfg) {
  switch (cfg.type) {
    case 'bugglin': return new Bugglin(lv, x, y, cfg);
    case 'loopling': return new Loopling(lv, x, y, cfg);
    case 'shadowif': return new ShadowIf(lv, x, y, cfg);
    case 'drainer': return new Drainer(lv, x, y, cfg);
    case 'chaos': return new ChaosPacket(lv, x, y, cfg);
    case 'overflow': return new Overflow(lv, x, y, cfg);
  }
  return new Bugglin(lv, x, y, cfg);
}
class Enemy extends Entity {
  constructor(lv, x, y, w, h, cfg) { super(lv, x, y, w, h); this.cfg = cfg; this.hostile = true; this.face = -1; this.id = cfg.id; }
  stompCheck() {
    const p = this.lv.player;
    if (!rectHit(p, this)) return false;
    if (p.vy > 40 && p.y + p.h - this.y < 10) { p.vy = -200; this.debug(); return true; }
    p.hurt(this); return true;
  }
  debug() {
    this.dead = true; this.hostile = false;
    AudioSys.sfx('debug'); addXP(8); addMastery('debugging', 1.5);
    Particles.burst(this.x + this.w / 2, this.y + this.h / 2, 14, { colors: [PAL.violet, PAL.lime, PAL.white], min: 20, max: 70, type: 'bit' });
    Particles.text(this.x + this.w / 2, this.y - 6, this.fixText || '¡depurado!', PAL.lime);
    this.lv.addEntity(new FreedCritter(this.lv, this.x, this.y, this.freeKind || 'ladybug'));
    if (this.cfg.onDebug) this.cfg.onDebug(this.lv);
  }
  bounce(p) { p.vx = -p.face * 150; p.vy = -120; }
}
class FreedCritter extends Entity {

  update(dt) { super.update(dt); this.life -= dt; this.y -= 25 * dt; this.x += Math.sin(this.t * 4) * 20 * dt; if (this.life <= 0) this.dead = true; }

}
class Bugglin extends Enemy {
  constructor(lv, x, y, cfg) { super(lv, x + 3, y + 9, 10, 7, cfg); this.speed = cfg.speed || 25; this.fixText = '¡instrucción reparada!'; }
  update(dt) {
    super.update(dt);
    const lv = this.lv;
    const nx = this.x + this.face * this.speed * dt;
    const aheadX = this.face > 0 ? nx + this.w : nx;
    const wall = lv.solidAt(Math.floor(aheadX / TILE), Math.floor((this.y + 3) / TILE));
    const floor = lv.solidAt(Math.floor(aheadX / TILE), Math.floor((this.y + this.h + 2) / TILE)) || lv.oneWayAt(Math.floor(aheadX / TILE), Math.floor((this.y + this.h + 2) / TILE));
    if (wall || !floor) this.face *= -1; else this.x = nx;
    if (Math.random() < 0.02) Particles.spawn({ x: this.x + rand(0, 10), y: this.y, vy: -12, life: 0.6, type: 'bit', color: PAL.violet });
    this.stompCheck();
  }
  draw(g, cx, cy) { const f = Spr.enemy.bugglin[Math.floor(this.t * 6) % 2]; g.drawImage(this.face > 0 ? f.r : f.l, Math.round(this.x - 1 - cx), Math.round(this.y - 1 - cy)); }
  lensInfo() { return ['BUGGLIN', '{v}intercambia el orden{/}', 'salta encima: {g}depurar{/}']; }
}
class Loopling extends Enemy {
  constructor(lv, x, y, cfg) { super(lv, x, y, 12, 12, cfg); this.ox = x + 2; this.oy = y + 2; this.r = (cfg.r || 2.5) * TILE; this.exitA = cfg.exitA || 1.2; this.a = 0; this.iter = 0; this.stopped = false; this.freeKind = 'ladybug'; }
  update(dt) {
    super.update(dt);
    if (this.stopped) { this.y += Math.sin(this.t * 2) * 0.1; return; }
    const prevA = this.a;
    this.a += dt * (this.cfg.speed || 2.2);
    if (Math.floor(prevA / (Math.PI * 2)) !== Math.floor(this.a / (Math.PI * 2))) this.iter++;
    this.x = this.ox + Math.cos(this.a) * this.r; this.y = this.oy + Math.sin(this.a) * this.r * (this.cfg.flat || 0.6);
    const p = this.lv.player;
    // nodo de salida visible con la lente
    const ex = this.ox + Math.cos(this.exitA) * this.r + 6, ey = this.oy + Math.sin(this.exitA) * this.r * (this.cfg.flat || 0.6) + 6;
    if (this.lv.lensT > 0.5 && dist(p.cx, p.y + 10, ex, ey) < 12) {
      this.stopped = true; this.hostile = false; AudioSys.sfx('win'); addMastery(['loops', 'debugging'], 3); addXP(12);
      Particles.text(ex, ey - 10, 'condición de salida: VERDADERA', PAL.lime);
      Particles.burst(this.x + 6, this.y + 6, 20, { colors: [PAL.aqua, PAL.lime], min: 20, max: 60 });
      if (this.cfg.onStop) this.cfg.onStop(this.lv);
      return;
    }
    if (rectHit(p, this)) p.hurt(this);
  }
  draw(g, cx, cy) {
    const x = Math.round(this.x - cx), y = Math.round(this.y - cy);
    if (this.stopped) { pring(g, x + 6, y + 6, 5, PAL.lime); drawText(g, 'FIN', x + 6, y + 3, PAL.lime, { align: 'center' }); return; }
    // rastro del bucle
    for (let i = 1; i < 6; i++) { const a = this.a - i * 0.25; px(g, this.ox + Math.cos(a) * this.r + 6 - cx, this.oy + Math.sin(a) * this.r * (this.cfg.flat || 0.6) + 6 - cy, rgba(PAL.aqua, 1 - i / 6)); }
    pcircle(g, x + 6, y + 6, 6, '#2A6AA8'); pring(g, x + 6, y + 6, 6, PAL.aqua);
    const s = this.t * 10; for (let k = 0; k < 3; k++) px(g, x + 6 + Math.cos(s + k * 2.1) * 4, y + 6 + Math.sin(s + k * 2.1) * 4, '#FFFFFF');
    drawText(g, '↻', x + 4, y + 3, '#FFFFFF');
  }
  drawOverlay(g, cx, cy) {
    if (this.stopped || this.lv.lensT < 0.1) return;
    const ex = this.ox + Math.cos(this.exitA) * this.r + 6, ey = this.oy + Math.sin(this.exitA) * this.r * (this.cfg.flat || 0.6) + 6;
    g.globalAlpha = this.lv.lensT;
    pring(g, ex - cx, ey - cy, 5 + Math.sin(this.t * 6), PAL.lime); px(g, ex - cx, ey - cy, '#FFFFFF');
    drawText(g, 'SALIDA', ex - cx, ey - cy + 8, PAL.lime, { align: 'center', outline: PAL.ink });
    g.globalAlpha = 1;
  }
  lensInfo() { return this.stopped ? null : ['LOOPLING: MIENTRAS VERDADERO', 'iteración ' + this.iter + ' · sin salida', 'toca el nodo {g}SALIDA{/}']; }
}
class ShadowIf extends Enemy {
  constructor(lv, x, y, cfg) { super(lv, x + 1, y, 14, 14, cfg); this.oy = y; this.freeKind = 'ladybug'; this.fixText = '¡condición corregida!'; }
  update(dt) {
    super.update(dt);
    // flota por encima de su sitio (nunca atraviesa el suelo)
    this.y = this.oy - 4 - (Math.sin(this.t * 1.5) * 0.5 + 0.5) * (this.cfg.amp || 20);
    const p = this.lv.player;
    const near = dist(p.cx, p.y + 10, this.x + 7, this.y + 7) < 46;
    if (near && !p.shieldOn && !this.lv.inverted) { this.lv.inverted = 1.6; Bark.say('pix', '¡SHADOW IF invirtió tus controles! SI izquierda → derecha...'); AudioSys.sfx('bug'); }
    if (near && !p.shieldOn) this.lv.inverted = Math.max(this.lv.inverted || 0, 0.6);
    this.stompCheck();
  }
  draw(g, cx, cy) {
    const f = Spr.enemy.shadowif[Math.floor(this.t * 4) % 4];
    g.drawImage(f.r, Math.round(this.x - 1 - cx), Math.round(this.y - 1 - cy));
    const p = this.lv.player;
    if (dist(p.cx, p.y + 10, this.x + 7, this.y + 7) < 60) { g.globalAlpha = 0.2; pring(g, this.x + 7 - cx, this.y + 7 - cy, 46, PAL.violet); g.globalAlpha = 1; }

}
class Drainer extends Enemy {
  constructor(lv, x, y, cfg) { super(lv, x, y, 10, 9, cfg); this.oy = y; this.ox = x; this.freeKind = 'ladybug'; this.fixText = '¡energía devuelta!'; this.priority = cfg.priority || 3; }
  update(dt) {
    super.update(dt);
    const p = this.lv.player;
    const d = dist(p.cx, p.y + 10, this.x + 5, this.y + 5);
    if (d < 90) { this.x += sign(p.cx - this.x - 5) * 18 * dt; this.y += sign(p.y + 6 - this.y) * 12 * dt; }
    else { this.x = lerp(this.x, this.ox, dt); this.y = lerp(this.y, this.oy - 5 + Math.sin(this.t * 2) * 3, Math.min(1, dt * 3)); }
    if (rectHit(p, this)) {
      if (p.dashT > 0) { this.debug(); return; }
      p.energy = Math.max(0, p.energy - 60 * dt);
      if (Math.random() < 0.3) Particles.spawn({ x: p.cx, y: p.y + 8, vx: (this.x - p.x) * 2, vy: -10, life: 0.4, type: 'dot', color: PAL.sun });
      if (p.energy <= 0) p.hurt(this);
      if (p.vy > 40 && p.y + p.h - this.y < 8) { p.vy = -200; this.debug(); }
    }
  }
  draw(g, cx, cy) { const f = Spr.enemy.drainer[Math.floor(this.t * 5) % 3]; g.drawImage(f.r, Math.round(this.x - 1 - cx), Math.round(this.y - 1 - cy)); }
  lensInfo() { return ['DRAINER', 'energia -= 60/s', '{p}PRIORITY DASH{/} lo atraviesa']; }
}
class ChaosPacket extends Enemy {
  constructor(lv, x, y, cfg) { super(lv, x + 4, y + 4, 8, 6, cfg); this.vx = cfg.vx || 40; this.vy = 0; this.freeKind = 'ladybug'; this.fixText = '¡datos ordenados!'; }

    const nx = this.x + this.vx * dt;
    if (lv.solidAt(Math.floor((this.vx > 0 ? nx + this.w : nx) / TILE), Math.floor((this.y + 3) / TILE))) this.vx *= -1; else this.x = nx;
    const ny = this.y + this.vy * dt;
    if (lv.solidAt(Math.floor((this.x + 4) / TILE), Math.floor((ny + this.h) / TILE)) || lv.oneWayAt(Math.floor((this.x + 4) / TILE), Math.floor((ny + this.h) / TILE))) { this.y = Math.floor((ny + this.h) / TILE) * TILE - this.h; this.vy = -rand(160, 220); } else this.y = ny;
    const p = lv.player;
    if (rectHit(p, this)) {
      if (p.vy > 40 && p.y + p.h - this.y < 10) { p.vy = -200; this.debug(); return; }
      if (p.inv <= 0 && !p.shieldOn && G.save.pack && G.save.pack.length > 1) { G.save.pack = shuffle(G.save.pack); Bark.say('pix', '¡CHAOS PACKET desordenó la mochila! Los índices cambiaron.'); AudioSys.sfx('bug'); }
      p.hurt(this);
    }
  }
  draw(g, cx, cy) { const f = Spr.enemy.chaos[Math.floor(this.t * 6) % 2]; g.drawImage(f.r, Math.round(this.x - 1 - cx), Math.round(this.y - 1 - cy)); }
  lensInfo() { return ['CHAOS PACKET', '{o}desordena listas{/}']; }
}
class Overflow extends Enemy {
  constructor(lv, x, y, cfg) { super(lv, x, y + 8, 16, 8, cfg); this.size = 4; this.base = y + 16; this.cx0 = x + 8; this.phase = 0; this.freeKind = 'ladybug'; this.fixText = '¡capacidad respetada!'; }

// Figura de ECLIPSE (silueta de píxeles fragmentados)
function drawEclipseFigure(g, x, y, t, scale = 1, alpha = 1) {

  }

const BLOCK_CAT = {
  act: { color: '#30E1C5', dark: '#135A52', name: 'acción' },
  if: { color: '#FF9D42', dark: '#6A3A10', name: 'decisión' },
  repeat: { color: '#59C7FF', dark: '#1A4A7A', name: 'bucle' },
  while: { color: '#59C7FF', dark: '#1A4A7A', name: 'bucle' },
  foreach: { color: '#7FE7FF', dark: '#1A5A6A', name: 'recorrido' },
  set: { color: '#B6F35B', dark: '#3A5A10', name: 'variable' },
  add: { color: '#B6F35B', dark: '#3A5A10', name: 'acumulador' },
  call: { color: '#C9A2FF', dark: '#4A2A7A', name: 'función' },
  ret: { color: '#C9A2FF', dark: '#4A2A7A', name: 'retorno' },
  blank: { color: '#8C93B8', dark: '#2A3060', name: 'hueco' }
};
const OPS = ['>', '<', '>=', '<=', '==', '!='];
const OP_TXT = { '>': '>', '<': '<', '>=': '≥', '<=': '≤', '==': '=', '!=': '≠' };

// ---------- utilidades del modelo ----------
function cloneProg(p) { return JSON.parse(JSON.stringify(p || [])); }
function hasBody(b) { return ['if', 'repeat', 'while', 'foreach'].includes(b.op); }
function countBlocks(list) { let n = 0; for (const b of list) { n++; if (b.body) n += countBlocks(b.body); if (b.else) n += countBlocks(b.else); } return n; }
function getList(root, path) { // path: [] => root ; [i,'body'] => root[i].body ; ...
  let l = root;
  for (let k = 0; k < path.length; k += 2) l = l[path[k]][path[k + 1]];
  return l;
}
function getBlock(root, path) { const l = getList(root, path.slice(0, -1)); return l[path[path.length - 1]]; }
function pathKey(p) { return p.join('.'); }
function exprText(e) {
  if (e == null) return '?';
  if (typeof e === 'number') return String(Math.round(e * 100) / 100);
  if (typeof e === 'string') return e;
  if (e.bin) return exprText(e.a) + ' ' + e.bin + ' ' + exprText(e.b);
  return '?';
}
function condText(c) {
  if (!c) return '?';
  let s = exprText(c.l) + ' ' + OP_TXT[c.op] + ' ' + exprText(c.r);
  if (c.join && c.c2) s += ' ' + c.join + ' ' + condText(c.c2);
  return s;
}
function blockText(b, fns) {
  switch (b.op) {
    case 'act': return b.name + (b.arg != null ? '(' + exprText(b.arg) + ')' : '');
    case 'if': return 'SI ' + condText(b.cond) + ' ENTONCES';
    case 'repeat': return 'REPETIR ' + exprText(b.n) + ' VECES';
    case 'while': return 'MIENTRAS ' + condText(b.cond) + ' HACER';
    case 'foreach': return 'PARA CADA ' + b.var + ' EN ' + b.list;
    case 'set': return b.var + ' ← ' + exprText(b.expr);
    case 'add': return b.var + ' ← ' + b.var + ' + ' + exprText(b.expr);
    case 'call': return (b.into ? b.into + ' ← ' : '') + 'LLAMAR ' + b.fn + '(' + (b.args || []).map(exprText).join(', ') + ')';
    case 'ret': return 'DEVOLVER ' + exprText(b.expr);
    case 'blank': return '▢ ' + (b.hint || '???');
  }
  return '?';
}
function progToText(list, depth = 0) {
  let out = [];
  const ind = '  '.repeat(depth);
  for (const b of list) {
    out.push(ind + blockText(b));
    if (b.body) out = out.concat(progToText(b.body, depth + 1));
    if (b.op === 'if' && b.else) { out.push(ind + 'SINO'); out = out.concat(progToText(b.else, depth + 1)); }
    if (hasBody(b)) out.push(ind + { if: 'FIN SI', repeat: 'FIN REPETIR', while: 'FIN MIENTRAS', foreach: 'FIN PARA' }[b.op]);
  }
  return out;
}

// ---------- Plantillas de la paleta ----------
// Cada puzzle declara su paleta con cadenas: 'act:avanzar', 'if', 'ifelse', 'repeat', 'while', 'foreach', 'set:x', 'add:x', 'call:f', 'ret'
function makeFromTemplate(tpl, cfg) {
  const [kind, name] = tpl.split(':');
  const d = cfg.defaults || {};
  switch (kind) {
    case 'act': { const a = (cfg.actions || {})[name] || {}; return { op: 'act', name, arg: a.arg != null ? a.arg : undefined }; }
    case 'if': return { op: 'if', cond: JSON.parse(JSON.stringify(d.cond || { l: (cfg.sensors || ['x'])[0], op: '>', r: 0 })), body: [], else: null };
    case 'ifelse': return { op: 'if', cond: JSON.parse(JSON.stringify(d.cond || { l: (cfg.sensors || ['x'])[0], op: '>', r: 0 })), body: [], else: [] };
    case 'repeat': return { op: 'repeat', n: d.n || 3, body: [] };
    case 'while': return { op: 'while', cond: JSON.parse(JSON.stringify(d.wcond || d.cond || { l: (cfg.sensors || ['x'])[0], op: '<', r: 10 })), body: [] };
    case 'foreach': return { op: 'foreach', var: d.itemVar || 'item', list: name || d.list || 'lista', body: [] };
    case 'set': return { op: 'set', var: name, expr: d.setExpr != null ? d.setExpr : 0 };
    case 'add': return { op: 'add', var: name, expr: d.addExpr != null ? d.addExpr : 1 };
    case 'call': { const f = (cfg.functions || {})[name]; return { op: 'call', fn: name, args: f ? f.params.map(p => (f.defaults || {})[p] != null ? f.defaults[p] : 0) : [], into: f && f.returns ? f.returns : undefined }; }
    case 'ret': return { op: 'ret', expr: d.retExpr || 0 };
  }
  return { op: 'blank' };
}
function templateLabel(tpl, cfg) {
  const [kind, name] = tpl.split(':');
  switch (kind) {
    case 'act': { const a = (cfg.actions || {})[name] || {}; return a.label || name; }
    case 'if': return 'SI ... ENTONCES';
    case 'ifelse': return 'SI ... SINO';
    case 'repeat': return 'REPETIR n VECES';
    case 'while': return 'MIENTRAS ...';
    case 'foreach': return 'PARA CADA';
    case 'set': return name + ' ← valor';
    case 'add': return name + ' ← ' + name + ' + ...';
    case 'call': return 'LLAMAR ' + name + '()';
    case 'ret': return 'DEVOLVER';
  }
  return tpl;
}
function templateCat(tpl) { const k = tpl.split(':')[0]; return k === 'ifelse' ? 'if' : k; }

// ---------- Intérprete (generadores) ----------
class ReturnSignal { constructor(v) { this.value = v; } }
class ExecError { constructor(path, msg, kind) { this.path = path; this.msg = msg; this.kind = kind || 'error'; } }

function evalExpr(e, env) {
  if (e == null) return 0;
  if (typeof e === 'number') return e;
  if (typeof e === 'string') {
    if (e in env.vars) return env.vars[e];
    if (env.sensors && e in env.sensors) return env.sensors[e](env.st, env);
    if (e === 'VERDADERO') return true;
    if (!isNaN(parseFloat(e))) return parseFloat(e);
    if (env.literals && env.literals.has(e)) return e;
    throw new ExecError(env.curPath, `La variable "${e}" no existe todavía. ¿Olvidaste darle un valor (←)?`, 'undefined');
  }
  if (e.bin) {
    const a = evalExpr(e.a, env), b = evalExpr(e.b, env);
    switch (e.bin) { case '+': return a + b; case '-': return a - b; case '*': return a * b; case '/': return b === 0 ? 0 : a / b; }
  }
  return 0;
}
function evalCond(c, env) {
  const a = evalExpr(c.l, env), b = evalExpr(c.r, env);
  let v;
  const A = typeof a === 'string' ? a : a, B = typeof b === 'string' ? b : b;
  switch (c.op) { case '>': v = A > B; break; case '<': v = A < B; break; case '>=': v = A >= B; break; case '<=': v = A <= B; break; case '==': v = A == B; break; case '!=': v = A != B; break; }
  if (env.inverted) v = !v; // efecto de SHADOW IF en algunos retos
  if (c.join && c.c2) { const v2 = evalCond(c.c2, env); v = c.join === 'Y' ? v && v2 : v || v2; }
  return v;
}
function fmtVal(v) { if (typeof v === 'number') return String(Math.round(v * 100) / 100); if (typeof v === 'boolean') return v ? 'VERDADERO' : 'FALSO'; if (v && v.name) return v.name; return String(v); }

function* execList(list, env, path, fnName) {
  for (let i = 0; i < list.length; i++) yield* execStmt(list[i], env, path.concat(i), fnName);
}
function* execStmt(b, env, path, fnName) {
  env.curPath = path; env.curFn = fnName || null;
  env.steps++;
  if (env.steps > env.maxSteps) throw new ExecError(path, 'Demasiados pasos: el programa parece no terminar nunca.', 'infinite');
  yield { t: 'line', path, fn: fnName, b };
  switch (b.op) {
    case 'blank': throw new ExecError(path, 'Hay un hueco ▢ sin completar. Arrastra un bloque sobre él.', 'blank');
    case 'act': {
      const arg = b.arg != null ? evalExpr(b.arg, env) : undefined;
      const r = env.world.act(b.name, arg, env.st, env) || { ok: true };
      env.trace.push({ path, fn: fnName, ok: r.ok !== false, text: b.name + (arg != null ? '(' + fmtVal(arg) + ')' : ''), msg: r.msg });
      yield { t: 'act', path, r, dur: r.dur == null ? 0.35 : r.dur };
      if (r.ok === false) throw new ExecError(path, r.msg || 'La acción falló.', r.kind || 'act');
      if (r.stop) throw new ExecError(path, r.msg, 'stop');
      break;
    }
    case 'if': {
      const v = evalCond(b.cond, env);
      env.trace.push({ path, fn: fnName, ok: true, text: condText(b.cond) + ' → ' + (v ? 'VERDADERO' : 'FALSO'), cond: v });
      yield { t: 'cond', path, v, text: condText(b.cond) };
      if (v) yield* execList(b.body, env, path.concat('body'), fnName);
      else if (b.else) yield* execList(b.else, env, path.concat('else'), fnName);
      break;
    }
    case 'repeat': {
      const n = Math.max(0, Math.floor(evalExpr(b.n, env)));
      for (let k = 0; k < n; k++) {
        env.iter[pathKey(path)] = { k: k + 1, n };
        env.trace.push({ path, fn: fnName, ok: true, text: 'iteración ' + (k + 1) + ' de ' + n });
        yield { t: 'iter', path, k: k + 1, n };
        yield* execList(b.body, env, path.concat('body'), fnName);
      }
      delete env.iter[pathKey(path)];
      break;
    }
    case 'while': {
      let k = 0;
      while (true) {
        const v = evalCond(b.cond, env);
        yield { t: 'cond', path, v, text: condText(b.cond) };
        if (!v) break;
        k++;
        if (k > (env.loopLimit || 40)) throw new ExecError(path, `¡LOOPLING! Este MIENTRAS lleva ${k - 1} vueltas y su condición sigue VERDADERA. ¿Qué cambia dentro del bucle para que algún día sea FALSA?`, 'infinite');
        env.iter[pathKey(path)] = { k, n: '?' };
        env.trace.push({ path, fn: fnName, ok: true, text: 'vuelta ' + k + ': ' + condText(b.cond) + ' VERDADERO' });
        yield { t: 'iter', path, k, n: '?' };
        yield* execList(b.body, env, path.concat('body'), fnName);
      }
      delete env.iter[pathKey(path)];
      env.trace.push({ path, fn: fnName, ok: true, text: 'condición FALSA → salir del bucle' });
      break;
    }
    case 'foreach': {
      const list = env.lists[b.list];
      if (!list) throw new ExecError(path, `No existe la lista "${b.list}".`);
      for (let k = 0; k < list.length; k++) {
        env.vars[b.var] = list[k]; env.vars['i'] = k;
        env.iter[pathKey(path)] = { k: k + 1, n: list.length, idx: k, list: b.list };
        env.trace.push({ path, fn: fnName, ok: true, text: `${b.var} ← ${b.list}[${k}] = ${fmtVal(list[k])}` });
        yield { t: 'iter', path, k: k + 1, n: list.length, idx: k };
        yield* execList(b.body, env, path.concat('body'), fnName);
      }
      delete env.iter[pathKey(path)];
      break;
    }
    case 'set': case 'add': {
      const v = evalExpr(b.expr, env);
      const old = env.vars[b.var];
      if (b.op === 'add' && old === undefined) throw new ExecError(path, `"${b.var}" no tiene valor inicial. Un acumulador debe empezar en algo (por ejemplo ${b.var} ← 0).`, 'undefined');
      env.vars[b.var] = b.op === 'set' ? v : old + v;
      env.changed[b.var] = 1;
      env.trace.push({ path, fn: fnName, ok: true, text: b.var + ' = ' + fmtVal(env.vars[b.var]) });
      if (env.world.onVar) env.world.onVar(b.var, env.vars[b.var], env.st, env);
      yield { t: 'var', path, name: b.var };
      break;
    }
    case 'call': {
      const f = env.functions[b.fn];
      if (!f) throw new ExecError(path, `La función "${b.fn}" no está definida. Constrúyela primero en la Forja.`, 'call');
      if (!f.body.length) throw new ExecError(path, `"${b.fn}" existe pero está vacía: no hace nada.`, 'call');
      const args = (b.args || []).map(a => evalExpr(a, env));
      const saved = env.vars;
      const local = Object.assign({}, env.globals || {});
      f.params.forEach((p, i) => local[p] = args[i]);
      env.trace.push({ path, fn: fnName, ok: true, text: 'LLAMAR ' + b.fn + '(' + args.map(fmtVal).join(', ') + ')' });
      yield { t: 'call', path, fn: b.fn, args };
      env.vars = local; env.callDepth++;
      if (env.callDepth > 6) throw new ExecError(path, 'Demasiadas llamadas anidadas.', 'call');
      let ret;
      try { yield* execList(f.body, env, ['fn', b.fn], b.fn); }
      catch (e) { if (e instanceof ReturnSignal) ret = e.value; else { env.vars = saved; env.callDepth--; throw e; } }
      env.vars = saved; env.callDepth--;
      env.curFn = fnName;
      if (b.into) { env.vars[b.into] = ret; env.changed[b.into] = 1; }
      if (env.world.onCall) env.world.onCall(b.fn, args, ret, env.st, env);
      env.trace.push({ path, fn: fnName, ok: true, text: b.fn + ' devolvió ' + (ret === undefined ? '(nada)' : fmtVal(ret)) });
      yield { t: 'return', path, fn: b.fn, value: ret };
      if (b.into && ret === undefined && f.returns) throw new ExecError(path, `"${b.fn}" terminó sin DEVOLVER un valor.`, 'call');
      break;
    }
    case 'ret': {
      const v = evalExpr(b.expr, env);
      yield { t: 'var', path, name: '↩' };
      throw new ReturnSignal(v);
    }
  }
}

// ---------- Escena del CodeLab ----------
const SPEEDS = [{ n: 'LENTO', line: 0.7 }, { n: 'NORMAL', line: 0.32 }, { n: 'RÁPIDO', line: 0.12 }, { n: 'TURBO', line: 0.03 }];

class CodeLabScene {

    this.hintLevel = 0; this.attempts = 0; this.fails = 0; this.runs = 0; this.firstTry = true;
    this.msg = cfg.intro || '¡Construye el algoritmo y pulsa EJECUTAR!'; this.msgColor = PAL.cream; this.msgWho = 'pix';
    this.panelTab = 'vars'; this.breakpoints = new Set(); this.view = 'code';
