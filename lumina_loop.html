// ---------- Utilidades matemáticas ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choice = arr => arr[Math.floor(Math.random() * arr.length)];
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const approach = (v, t, s) => v < t ? Math.min(v + s, t) : Math.max(v - s, t);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const rectHit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const inRect = (px, py, r) => px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h;
const fmt = (v, d = 0) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffle(arr, rng = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- Color ----------
const _rgbCache = {};
function hexRgb(hex) {
  if (_rgbCache[hex]) return _rgbCache[hex];
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return (_rgbCache[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
}
const toHex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return toHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function rgba(hex, a) { const c = hexRgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const shade = (hex, t) => t >= 0 ? mix(hex, '#FFFFFF', t) : mix(hex, '#0A0E1C', -t);
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return toHex(255 * f(0), 255 * f(8), 255 * f(4));
}
function desaturate(hex, t) { const c = hexRgb(hex); const g = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11; return toHex(lerp(c[0], g, t), lerp(c[1], g, t), lerp(c[2], g, t)); }

// ---------- Lienzos auxiliares ----------
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  c.g = g;
  return c;
}

// ---------- Estado global de tiempo ----------
const Time = { t: 0, frame: 0, dt: 1 / 60, real: 0 };

// ---------- Escalado de pantalla ----------
function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  let s = Math.min(ww / W, wh / H);
  const pp = typeof G !== 'undefined' && G.save && G.save.settings && G.save.settings.pixelPerfect;
  if (pp && s >= 1) s = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', resize);

// =====================================================================
//  ENTRADA
// =====================================================================
const DEFAULT_BINDINGS = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
  jump: ['Space', 'KeyZ', 'KeyK'], interact: ['KeyE', 'KeyX', 'KeyJ'],
  ability: ['KeyQ', 'KeyL'], lens: ['KeyF'], blueprint: ['KeyB'], codex: ['KeyC'],
  hint: ['KeyH'], pause: ['Escape', 'KeyP'], run: ['ShiftLeft', 'ShiftRight'],
  confirm: ['Enter', 'NumpadEnter', 'Space'], back: ['Escape', 'Backspace'],
  del: ['Delete', 'Backspace'], tab: ['Tab'], swap: ['KeyR']
};

const Input = {
  keys: {}, pressedCodes: {}, releasedCodes: {}, bindings: JSON.parse(JSON.stringify(DEFAULT_BINDINGS)),
  virtual: {}, virtualPrev: {}, gp: {}, gpPrev: {},
  lastDevice: 'keyboard', anyKeyHit: false, captureNext: null,
  pointer: { x: -99, y: -99, down: false, pressed: false, released: false, id: null, type: 'mouse', moved: false, startX: 0, startY: 0, wheel: 0 },
  touches: new Map(),
  down(a) {
    const b = this.bindings[a] || [];
    for (const c of b) if (this.keys[c]) return true;
    return !!(this.virtual[a] || this.gp[a]);
  },
  hit(a) {
    const b = this.bindings[a] || [];
    for (const c of b) if (this.pressedCodes[c]) return true;
    return !!((this.virtual[a] && !this.virtualPrev[a]) || (this.gp[a] && !this.gpPrev[a]));
  },
  released(a) {
    const b = this.bindings[a] || [];
    for (const c of b) if (this.releasedCodes[c]) return true;
    return !!((!this.virtual[a] && this.virtualPrev[a]) || (!this.gp[a] && this.gpPrev[a]));
  },
  codeHit(code) { return !!this.pressedCodes[code]; },
  axisX() { return (this.down('right') ? 1 : 0) - (this.down('left') ? 1 : 0) + (this.gpAxisX || 0); },
  endStep() {
    this.pressedCodes = {}; this.releasedCodes = {};
    this.virtualPrev = Object.assign({}, this.virtual);
    this.gpPrev = Object.assign({}, this.gp);
    this.pointer.pressed = false; this.pointer.released = false; this.pointer.wheel = 0;
    this.anyKeyHit = false;
  },
  consume() { // evita que una misma pulsación active dos cosas
    this.pressedCodes = {}; this.pointer.pressed = false; this.pointer.released = false;
    this.virtualPrev = Object.assign({}, this.virtual); this.gpPrev = Object.assign({}, this.gp);
    this.anyKeyHit = false;
  },
  pollGamepad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const p = pads && Array.from(pads).find(x => x && x.connected);
    this.gp = {}; this.gpAxisX = 0;
    if (!p) return;
    const b = i => p.buttons[i] && p.buttons[i].pressed;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    if (Math.abs(ax) > 0.35) this.gpAxisX = 0; // se traduce a izquierda/derecha
    this.gp.left = b(14) || ax < -0.35; this.gp.right = b(15) || ax > 0.35;
    this.gp.up = b(12) || ay < -0.5; this.gp.down = b(13) || ay > 0.5;
    this.gp.jump = b(0); this.gp.confirm = b(0); this.gp.interact = b(2); this.gp.back = b(1);
    this.gp.ability = b(3); this.gp.lens = b(4); this.gp.hint = b(5); this.gp.pause = b(9);
    this.gp.codex = b(8); this.gp.run = b(7) || b(6); this.gp.swap = b(11); this.gp.blueprint = b(10);
    for (const k in this.gp) if (this.gp[k]) { this.lastDevice = 'gamepad'; break; }
  }
};

window.addEventListener('keydown', e => {
  const code = e.code || e.key;
  if (Input.captureNext) { const cb = Input.captureNext; Input.captureNext = null; cb(code); e.preventDefault(); return; }
  if (!Input.keys[code]) { Input.pressedCodes[code] = true; Input.anyKeyHit = true; }
  Input.keys[code] = true;
  Input.lastDevice = 'keyboard';
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace'].includes(code)) e.preventDefault();
  if (typeof AudioSys !== 'undefined') AudioSys.unlock();
});
window.addEventListener('keyup', e => {
  const code = e.code || e.key;
  Input.keys[code] = false; Input.releasedCodes[code] = true;
});
window.addEventListener('blur', () => { Input.keys = {}; Input.virtual = {}; });

function toInternal(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  const p = toInternal(e);
  cv.focus();
  if (typeof AudioSys !== 'undefined') AudioSys.unlock();
  Input.touches.set(e.pointerId, { x: p.x, y: p.y, type: e.pointerType, start: Time.t });
  if (e.pointerType === 'touch') Input.lastDevice = 'touch'; else if (Input.lastDevice === 'touch') Input.lastDevice = 'mouse';
  const P = Input.pointer;
  if (P.id === null || !P.down) {
    P.id = e.pointerId; P.x = p.x; P.y = p.y; P.down = true; P.pressed = true; P.type = e.pointerType;
    P.startX = p.x; P.startY = p.y; P.moved = false;
  }
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const p = toInternal(e);
  if (Input.touches.has(e.pointerId)) { const t = Input.touches.get(e.pointerId); t.x = p.x; t.y = p.y; }
  const P = Input.pointer;
  if (P.id === e.pointerId || !P.down) {
    P.x = p.x; P.y = p.y;
    if (P.down && Math.hypot(p.x - P.startX, p.y - P.startY) > 3) P.moved = true;
    if (!P.down && e.pointerType === 'mouse') Input.lastDevice = Input.lastDevice === 'touch' ? 'mouse' : Input.lastDevice;
  }
});
function endPointer(e) {
  Input.touches.delete(e.pointerId);
  const P = Input.pointer;
  if (P.id === e.pointerId) {
    const p = toInternal(e);
    P.x = p.x; P.y = p.y; P.down = false; P.released = true; P.id = null;
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => { Input.pointer.wheel += sign(e.deltaY); e.preventDefault(); }, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- Nombres legibles de teclas ----------
function keyName(code) {
  if (!code) return '?';
  const map = { Space: 'ESPACIO', Enter: 'ENTER', Escape: 'ESC', ShiftLeft: 'SHIFT', ShiftRight: 'SHIFT', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Backspace: 'BORRAR', Tab: 'TAB', Delete: 'SUPR', ControlLeft: 'CTRL', AltLeft: 'ALT' };
  if (map[code]) return map[code];
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  return code;
}
const bindName = a => {
  if (Input.lastDevice === 'gamepad') {
    return { jump: 'A', interact: 'X', ability: 'Y', lens: 'LB', hint: 'RB', pause: 'START', confirm: 'A', back: 'B', codex: 'SELECT' }[a] || a;
  }
  return keyName((Input.bindings[a] || [])[0]);
};

const Font = {

  build() {
    const CELL_W = 8, CELL_H = 13, OFFSET = 3; // filas -3..9
    const keys = Object.keys(GLYPHS);
    const cols = 32, rows = Math.ceil(keys.length / cols);

    g.fillStyle = '#FFFFFF';
    keys.forEach((ch, i) => {
      let def = GLYPHS[ch], top = 0;

      const cx = (i % cols) * CELL_W, cy = Math.floor(i / cols) * CELL_H;
      lines.forEach((line, r) => {

  },
  tint(color) {

  },
  gl(ch) {

    if (!g) {

      case 'restore': [0, 4, 7, 11, 14, 19].forEach((s, i) => { T({ f: 392 * Math.pow(2, s / 12), dur: 0.3, type: 'triangle', vol: 0.07, delay: i * 0.09 }); }); N({ ff: 6000, ft: 'highpass', dur: 0.8, vol: 0.03, a: 0.3 }); this.caption('[la isla recupera energía]'); break;

      case 'steam': N({ ff: 5000, ft: 'highpass', dur: 0.4, vol: 0.08, a: 0.05 }); break;
    }
  },
  // ---------- música ----------
  playSong(name) {
    if (!this.ctx) { this.pendingSong = name; return; }
    if (this.song && this.song.name === name) return;
    const def = SONGS[name];
    if (!def) { this.song = null; return; }
    this.song = buildSong(name, def);
    this.stepIdx = 0; this.nextStep = this.ctx.currentTime + 0.08;
  },
  stopSong() { this.song = null; this.pendingSong = null; },
  schedule() {
    if (!this.ctx || !this.song) return;
    const s = this.song, c = this.ctx;
    const stepDur = 60 / s.bpm / 4;
    while (this.nextStep < c.currentTime + 0.12) {
      this.playStep(s, this.stepIdx, this.nextStep, stepDur);
      this.nextStep += stepDur * (s.swing && this.stepIdx % 2 === 0 ? 1 + s.swing : s.swing && this.stepIdx % 2 === 1 ? 1 - s.swing : 1);
      this.stepIdx = (this.stepIdx + 1) % (s.bars * 16);
    }
  },
  playStep(s, idx, when, sd) {
    const bar = Math.floor(idx / 16), st = idx % 16;
    const I = this.intensity;
    const bus = this.musicBus;
    const jit = () => s.human ? rand(-0.012, 0.012) : 0;
    const chord = s.chords[bar % s.chords.length];
    const nf = (deg, oct) => midiF(s.root + scaleNote(s.scale, deg) + 12 * oct);
    // pad (al inicio de cada compás)
    if (st === 0 && s.pad) chord.forEach(d => this.tone({ when, f: nf(d, 0), dur: sd * 15, a: 0.3, r: 0.4, type: s.pad, vol: 0.022, lp: 1400, bus, detune: rand(-6, 6) }));
    // bajo
    const b = s.bass[bar % s.bass.length][st];
    if (b !== '.' && b !== undefined) this.tone({ when: when + jit(), f: nf(chord[+b] - 7 * 0, -1), dur: sd * 1.6, type: s.bassType || 'triangle', vol: 0.11, lp: 900, bus });
    // arpegio
    if (I > 0.3 && s.arp) {
      const a = s.arp[st];
      if (a !== '.') this.tone({ when: when + jit(), f: nf(chord[+a % chord.length] + (+a >= chord.length ? 7 : 0), 1), dur: sd * 0.9, type: s.arpType || 'square', vol: 0.03, lp: s.arpLp || 3000, bus });
    }
    // melodía
    if (I > 0.55 && s.lead) {
      const n = s.lead[idx];
      if (n != null) this.tone({ when: when + jit(), f: nf(n.d, 1), dur: sd * n.l * 0.95, type: s.leadType || 'triangle', vol: 0.05, vib: 5, vibDepth: 3, a: 0.01, bus, lp: 4000 });
    }
    // batería
    if (I > 0.72 && s.drums) {
      const k = s.drums.k[st], sn = s.drums.s[st], h = s.drums.h[st];
      if (k === 'x') this.tone({ when, f: 140, f2: 45, slide: 0.12, dur: 0.12, type: 'sine', vol: 0.16, bus });
      if (sn === 'x') this.noise({ when, ff: s.organic ? 900 : 2500, ft: s.organic ? 'lowpass' : 'bandpass', dur: 0.1, vol: 0.06, bus });
      if (sn === 'o') this.tone({ when, f: 220, f2: 120, dur: 0.1, type: 'sine', vol: 0.1, bus });
      if (h === 'x') this.noise({ when, ff: 7000, ft: 'highpass', dur: 0.03, vol: 0.025, bus });
      if (h === 'w') this.tone({ when, f: 1400, dur: 0.02, type: 'square', vol: 0.02, bus, lp: 3000 });
    }
  },
  // ---------- ambiente ----------
  ambient(name) {
    if (!this.ctx) { this.pendingAmb = name; return; }
    if (this.ambientName === name) return;
    this.ambientName = name;
    const c = this.ctx;
    if (this.ambientNodes) {
      const old = this.ambientNodes;
      old.g.gain.setTargetAtTime(0.0001, c.currentTime, 0.4);
      setTimeout(() => { try { old.src.stop(); old.lfo && old.lfo.stop(); } catch (_) { } }, 2000);
      this.ambientNodes = null;
    }
    if (!name || name === 'none') return;
    const cfg = { wind: { ft: 'bandpass', f: 700, q: 0.8, v: 0.12, lfo: 0.15, depth: 400 }, water: { ft: 'lowpass', f: 700, q: 0.5, v: 0.14, lfo: 0.3, depth: 150 }, sea: { ft: 'lowpass', f: 500, q: 0.4, v: 0.16, lfo: 0.08, depth: 300 }, rain: { ft: 'highpass', f: 2500, q: 0.3, v: 0.08, lfo: 0.5, depth: 300 }, cave: { ft: 'lowpass', f: 220, q: 2, v: 0.14, lfo: 0.05, depth: 60 }, forest: { ft: 'bandpass', f: 3000, q: 2, v: 0.03, lfo: 2, depth: 800 }, city: { ft: 'lowpass', f: 180, q: 1, v: 0.1, lfo: 0.1, depth: 40 }, hum: { ft: 'bandpass', f: 120, q: 8, v: 0.1, lfo: 0.2, depth: 20 } }[name];
    if (!cfg) return;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = cfg.ft; f.frequency.value = cfg.f; f.Q.value = cfg.q;
    const g = c.createGain(); g.gain.value = 0.0001; g.gain.setTargetAtTime(cfg.v, c.currentTime, 0.8);
    const lfo = c.createOscillator(); lfo.frequency.value = cfg.lfo; const lg = c.createGain(); lg.gain.value = cfg.depth;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    src.connect(f); f.connect(g); g.connect(this.ambBus); src.start();
    this.ambientNodes = { src, g, lfo };
  }
};

}

function buildSong(name, d) {
  const rng = mulberry32(d.seed || 1);
  const bars = 8;
  const s = { name, bpm: d.bpm, root: d.root, scale: SCALES[d.scale] || SCALES.major, bars, human: !!d.human, swing: d.swing || 0 };
  s.chords = []; for (let b = 0; b < bars; b++) s.chords.push(d.prog[b % d.prog.length]);
  s.bass = d.bass; s.arp = d.arp; s.drums = d.drums ? DRUMS[d.drums] : null; s.organic = d.organic;
  s.pad = d.pad; s.bassType = d.bassType; s.arpType = d.arpType; s.leadType = d.leadType; s.arpLp = d.arpLp;
  // melodía
  const lead = new Array(bars * 16).fill(null);
  const style = d.lead;
  const motif = style && style.startsWith('motif');
  const phrase = [];
  for (let b = 0; b < 4; b++) {
    const ch = s.chords[b];
    let pos = 0;
    while (pos < 16) {
      let len = style === 'calm' || style === 'flute' ? choice([4, 4, 2, 6, 8]) : choice([2, 2, 4, 1, 2, 3]);
      if (style === 'motifRigid') len = 4;
      if (pos + len > 16) len = 16 - pos;
      const strong = pos % 4 === 0;
      let deg;
      if (motif) deg = AURORA_MOTIF[Math.floor((b * 16 + pos) / 4) % AURORA_MOTIF.length] + (style === 'motifWarm' && b % 2 ? 2 : 0);
      else deg = strong ? ch[Math.floor(rng() * ch.length)] : ch[0] + Math.floor(rng() * 5) - 2;
      const rest = !motif && rng() < (style === 'calm' ? 0.35 : 0.18);
      phrase.push({ i: b * 16 + pos, d: rest ? null : deg, l: len });
      pos += len;
    }
  }
  for (const n of phrase) {
    if (n.d == null) continue;
    lead[n.i] = { d: n.d, l: n.l };
    // repetición con variación en la segunda mitad
    const v = style === 'motifRigid' ? 0 : (rng() < 0.3 ? (rng() < 0.5 ? 1 : -1) : 0);
    lead[n.i + 64] = { d: n.d + v, l: n.l };
  }
  s.lead = style ? lead : null;
  return s;
}

// Crea un sprite desde filas de caracteres; cada carácter se busca en la paleta ('.' = transparente)
function spriteFromRows(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = makeCanvas(w, h), g = c.g;
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x];
    if (ch === '.' || ch === ' ') continue;
    const col = pal[ch]; if (!col) continue;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function flipCanvas(src) {
  const c = makeCanvas(src.width, src.height);
  c.g.translate(src.width, 0); c.g.scale(-1, 1); c.g.drawImage(src, 0, 0);
  return c;
}
function silhouette(src, color) {
  const c = makeCanvas(src.width, src.height);
  c.g.drawImage(src, 0, 0); c.g.globalCompositeOperation = 'source-in';
  c.g.fillStyle = color; c.g.fillRect(0, 0, c.width, c.height);
  return c;
}
function outlined(src, color) {
  const c = makeCanvas(src.width + 2, src.height + 2);
  const s = silhouette(src, color);
  for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2]]) c.g.drawImage(s, dx, dy);
  c.g.drawImage(src, 1, 1);
  return c;
}
function recolorCanvas(src, fn) {
  const c = makeCanvas(src.width, src.height); c.g.drawImage(src, 0, 0);
  const d = c.g.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) {
    if (d.data[i + 3] === 0) continue;
    const r = fn(d.data[i], d.data[i + 1], d.data[i + 2]);
    d.data[i] = r[0]; d.data[i + 1] = r[1]; d.data[i + 2] = r[2];
  }
  c.g.putImageData(d, 0, 0);
  return c;
}

// ---------- primitivas ----------
function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function px(g, x, y, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
function strokeRect(g, x, y, w, h, c) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  g.fillStyle = c; g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1); g.fillRect(x, y, 1, h); g.fillRect(x + w - 1, y, 1, h);
}
function pline(g, x0, y0, x1, y1, c, dash = 0, dashOff = 0) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, i = 0;
  g.fillStyle = c;
  for (let n = 0; n < 2000; n++) {
    if (!dash || Math.floor((i + dashOff) / dash) % 2 === 0) g.fillRect(x0, y0, 1, 1);
    i++;
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function pcircle(g, cx, cy, r, c) {
  g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * 0.8)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); }
}
function pring(g, cx, cy, r, c) {
  g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  let x = r, y = 0, err = 1 - r;
  while (x >= y) {
    for (const [a, b] of [[x, y], [y, x], [-y, x], [-x, y], [-x, -y], [-y, -x], [y, -x], [x, -y]]) g.fillRect(cx + a, cy + b, 1, 1);
    y++; if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; }
  }
}
function pellipse(g, cx, cy, rx, ry, c) {
  g.fillStyle = c;
  for (let y = -ry; y <= ry; y++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.5)))); g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); }
}
// Tramado (dithering) ordenado 4x4 para degradados pixel
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function ditherRect(g, x, y, w, h, c, level) {
  g.fillStyle = c;
  const th = level * 16;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (BAYER[((y + j) & 3) * 4 + ((x + i) & 3)] < th) g.fillRect(x + i, y + j, 1, 1);
}
function vGradient(g, x, y, w, h, stops, dither = true) {
  // stops: [[t,color],...] con bandas y tramado entre bandas
  const bands = Math.max(2, Math.floor(h / 6));
  for (let b = 0; b < bands; b++) {
    const t = b / (bands - 1);
    let i = 0; while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
    const a = stops[i], bb = stops[i + 1];
    const lt = clamp((t - a[0]) / Math.max(0.0001, bb[0] - a[0]), 0, 1);
    const col = mix(a[1], bb[1], lt);
    const y0 = y + Math.floor(b * h / bands), y1 = y + Math.floor((b + 1) * h / bands);
    rect(g, x, y0, w, y1 - y0, col);
  }
  if (dither) {
    for (let b = 0; b < bands - 1; b++) {
      const t = (b + 1) / (bands - 1);
      let i = 0; while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
      const a = stops[i], bb = stops[i + 1];
      const col = mix(a[1], bb[1], clamp((t - a[0]) / Math.max(0.0001, bb[0] - a[0]), 0, 1));
      const yb = y + Math.floor((b + 1) * h / bands);
      ditherRect(g, x, yb - 2, w, 2, col, 0.5);
    }
  }
}

// ---------- panel UI pixel ----------
function panel(g, x, y, w, h, o = {}) {
  const hc = G.save.settings.highContrast;
  const bg = o.bg || (hc ? '#05070F' : 'rgba(16,22,43,0.92)');
  const border = o.border || (hc ? PAL.white : '#3E4C8A');
  const hi = o.hi || (hc ? PAL.white : '#6A7BC4');
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  g.fillStyle = bg;
  g.fillRect(x + 1, y, w - 2, h); g.fillRect(x, y + 1, w, h - 2);
  g.fillStyle = border;
  g.fillRect(x + 2, y, w - 4, 1); g.fillRect(x + 2, y + h - 1, w - 4, 1);
  g.fillRect(x, y + 2, 1, h - 4); g.fillRect(x + w - 1, y + 2, 1, h - 4);
  g.fillRect(x + 1, y + 1, 1, 1); g.fillRect(x + w - 2, y + 1, 1, 1); g.fillRect(x + 1, y + h - 2, 1, 1); g.fillRect(x + w - 2, y + h - 2, 1, 1);
  if (!o.flat) { g.fillStyle = hi; g.fillRect(x + 2, y + 1, w - 4, 1); }
  if (o.accent) { g.fillStyle = o.accent; g.fillRect(x + 3, y, Math.min(w - 6, o.accentW || 18), 2); }
}
function bar(g, x, y, w, h, v, max, col, bg = '#1E2748') {
  rect(g, x, y, w, h, bg);
  const fw = Math.round(clamp(v / max, 0, 1) * (w - 2));
  rect(g, x + 1, y + 1, fw, h - 2, col);
  if (fw > 2) rect(g, x + 1, y + 1, fw, 1, shade(col, 0.35));
}

// ---------- efectos de pantalla ----------
const FX = {
  shakeT: 0, shakeMag: 0, flashA: 0, flashC: '#FFFFFF', ox: 0, oy: 0, hitstop: 0,
  shake(mag = 3, t = 0.3) { if (G.save.settings.reduceShake) return; this.shakeMag = Math.max(this.shakeMag, mag); this.shakeT = Math.max(this.shakeT, t); },
  flash(c = '#FFFFFF', a = 0.8) { if (G.save.settings.reduceFlash) a = Math.min(a, 0.15); this.flashC = c; this.flashA = Math.max(this.flashA, a); },
  update(dt) {
    if (this.shakeT > 0) {
      this.shakeT -= dt;
      const m = this.shakeMag * clamp(this.shakeT / 0.3, 0, 1);
      this.ox = Math.round(rand(-m, m)); this.oy = Math.round(rand(-m, m));
      if (this.shakeT <= 0) { this.ox = this.oy = 0; this.shakeMag = 0; }
    }
    this.flashA = Math.max(0, this.flashA - dt * 2.2);
  },
  drawFlash(g) { if (this.flashA > 0.01) { g.globalAlpha = this.flashA; rect(g, 0, 0, W, H, this.flashC); g.globalAlpha = 1; } }
};

// ---------- partículas (con reciclaje de objetos) ----------
const Particles = {
  list: [], pool: [],
  spawn(o) {
    if (this.list.length > 700) return null;
    const p = this.pool.pop() || {};
    p.x = o.x; p.y = o.y; p.vx = o.vx || 0; p.vy = o.vy || 0; p.life = o.life || 1; p.max = p.life;
    p.color = o.color || PAL.sun; p.size = o.size || 1; p.type = o.type || 'dot'; p.grav = o.grav || 0;
    p.drag = o.drag == null ? 0.98 : o.drag; p.text = o.text || ''; p.screen = !!o.screen; p.glow = !!o.glow;
    p.wob = o.wob || 0; p.ph = Math.random() * 6.28; p.color2 = o.color2 || null; p.layer = o.layer || 0;
    this.list.push(p); return p;
  },
  burst(x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.angle != null ? o.angle + rand(-(o.spread || 3.14), o.spread || 3.14) : rand(0, Math.PI * 2);
      const sp = rand(o.min || 20, o.max || 80);
      this.spawn(Object.assign({}, o, { x: x + rand(-(o.jx || 0), o.jx || 0), y: y + rand(-(o.jy || 0), o.jy || 0), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(o.lmin || 0.3, o.lmax || 0.8), color: Array.isArray(o.colors) ? choice(o.colors) : o.color }));
    }
  },
  text(x, y, text, color = PAL.sun, screen = false) { return this.spawn({ x, y, vy: -18, life: 1.1, type: 'text', text, color, drag: 0.95, screen }); },
  clear() { while (this.list.length) this.pool.push(this.list.pop()); },
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); this.pool.push(p); continue; }
      p.vy += p.grav * dt; p.vx *= p.drag; p.vy *= p.drag;
      p.x += (p.vx + (p.wob ? Math.sin(Time.t * 3 + p.ph) * p.wob : 0)) * dt; p.y += p.vy * dt;
    }
  },
  draw(g, cx, cy, screen = false, layer = 0) {
    for (const p of this.list) {
      if (p.screen !== screen || p.layer !== layer) continue;
      const x = Math.round(p.x - (screen ? 0 : cx)), y = Math.round(p.y - (screen ? 0 : cy));
      if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
      const t = p.life / p.max;
      const col = p.color2 ? mix(p.color2, p.color, t) : p.color;
      switch (p.type) {
        case 'dot': rect(g, x, y, p.size, p.size, col); break;
        case 'fade': g.globalAlpha = t; rect(g, x, y, p.size, p.size, col); g.globalAlpha = 1; break;
        case 'spark':
          rect(g, x, y, 1, 1, PAL.white);
          if (t > 0.4) { rect(g, x - 1, y, 1, 1, col); rect(g, x + 1, y, 1, 1, col); rect(g, x, y - 1, 1, 1, col); rect(g, x, y + 1, 1, 1, col); }
          break;
        case 'leaf': rect(g, x, y, 2, 1, col); if (Math.sin(Time.t * 6 + p.ph) > 0) rect(g, x + 1, y - 1, 1, 1, shade(col, 0.2)); break;
        case 'bubble': pring(g, x, y, p.size, col); px(g, x - 1, y - 1, PAL.white); break;
        case 'ring': g.globalAlpha = t; pring(g, x, y, Math.round((1 - t) * p.size), col); g.globalAlpha = 1; break;
        case 'text': drawText(g, p.text, x, y, col, { align: 'center', outline: '#10162B' }); break;
        case 'bit': drawText(g, p.text || (p.ph > 3 ? '1' : '0'), x, y, col); break;
        case 'star': rect(g, x, y, 1, 1, col); if ((Time.frame >> 3) % 2) { rect(g, x - 1, y, 3, 1, col); rect(g, x, y - 1, 1, 3, col); } break;
        case 'rain': rect(g, x, y, 1, 4, col); break;
        case 'snow': rect(g, x, y, p.size, p.size, col); break;
      }
    }
  }
};

// ---------- iluminación: oscuridad con fuentes de luz (a media resolución = píxeles gruesos) ----------
// haz giratorio de un faro: cuña de luz con degradado (se acorta cuando apunta hacia la cámara)
function drawLightBeam(g, x, y, a, len, spread, color, alpha) {
  const dx = Math.cos(a), L = len * (0.3 + 0.7 * Math.abs(dx));
  const ex = x + dx * L, ey = y + Math.sin(a) * L * 0.18, w = Math.max(3, L * spread);
  const grd = g.createLinearGradient(x, y, ex, ey);
  grd.addColorStop(0, rgba(color, alpha)); grd.addColorStop(0.6, rgba(color, alpha * 0.45)); grd.addColorStop(1, rgba(color, 0));
  g.fillStyle = grd;
  g.beginPath(); g.moveTo(x, y - 1.5); g.lineTo(ex, ey - w / 2); g.lineTo(ex, ey + w / 2); g.lineTo(x, y + 1.5); g.closePath(); g.fill();
}
const Light = {
  cv: null, lights: [],
  init() { this.cv = makeCanvas(W / 2, H / 2); },
  begin() { this.lights.length = 0; },
  add(x, y, r, a = 1, color = null) { this.lights.push({ x, y, r, a, color }); },
  render(g, darkness, tint = '#0B1030') {
    if (darkness <= 0.01) { this.drawGlows(g); return; }
    const L = this.cv, lg = L.g;
    lg.globalCompositeOperation = 'source-over';
    lg.clearRect(0, 0, L.width, L.height);
    lg.fillStyle = tint; lg.globalAlpha = darkness; lg.fillRect(0, 0, L.width, L.height); lg.globalAlpha = 1;
    lg.globalCompositeOperation = 'destination-out';
    for (const l of this.lights) {
      const x = l.x / 2, y = l.y / 2, r = l.r / 2;
      const grd = lg.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, `rgba(0,0,0,${l.a})`); grd.addColorStop(0.55, `rgba(0,0,0,${l.a * 0.7})`); grd.addColorStop(1, 'rgba(0,0,0,0)');
      lg.fillStyle = grd; lg.beginPath(); lg.arc(x, y, r, 0, Math.PI * 2); lg.fill();
    }
    lg.globalCompositeOperation = 'source-over';
    g.drawImage(L, 0, 0, W, H);
    this.drawGlows(g);
  },
  drawGlows(g) {
    g.globalCompositeOperation = 'lighter';
    for (const l of this.lights) {
      if (!l.color) continue;
      const grd = g.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r * 0.6);
      grd.addColorStop(0, rgba(l.color, 0.22 * l.a)); grd.addColorStop(1, rgba(l.color, 0));
      g.fillStyle = grd; g.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
    }
    g.globalCompositeOperation = 'source-over';
  }
};

// ---------- transición en diamantes (pixel) ----------
const Trans = {
  t: 0, dir: 0, cb: null, color: PAL.ink, dur: 0.4,
  go(cb, color = PAL.ink, dur = 0.4) { if (this.dir !== 0) { return; } this.dir = 1; this.t = 0; this.cb = cb; this.color = color; this.dur = dur; },
  get busy() { return this.dir !== 0; },
  update(dt) {
    if (this.dir === 1) {
      this.t += dt / this.dur;
      if (this.t >= 1) { this.t = 1; const cb = this.cb; this.cb = null; if (cb) cb(); this.dir = -1; this.hold = 0.05; }
    } else if (this.dir === -1) {
      if (this.hold > 0) { this.hold -= dt; return; }
      this.t -= dt / this.dur;
      if (this.t <= 0) { this.t = 0; this.dir = 0; }
    }
  },
  draw(g) {
    if (this.t <= 0) return;
    const S = 20;
    g.fillStyle = this.color;
    for (let y = -1; y < H / S + 1; y++) for (let x = -1; x < W / S + 1; x++) {
      const k = (x + y) / (W / S + H / S);
      const local = clamp(this.t * 2 - k, 0, 1);
      const r = Math.round(local * S * 0.75);
      if (r <= 0) continue;
      const cx = x * S + S / 2 + (y % 2 ? S / 2 : 0), cy = y * S + S / 2;
      for (let dy = -r; dy <= r; dy++) { const w = r - Math.abs(dy); g.fillRect(cx - w, cy + dy, w * 2 + 1, 1); }
    }
  }
};

// ---------- notificaciones ----------
// ---------------------------------------------------------------------
//  Reparto del espacio en pantalla para textos flotantes (globos, Lente,
//  avisos): cada etiqueta busca el hueco libre más cercano a su sitio ideal.
// ---------------------------------------------------------------------
const Labels = {
  rects: [],
  reset() { this.rects = []; },
  reserve(x, y, w, h) { this.rects.push({ x, y, w, h }); },
  hit(r) { return this.rects.some(o => r.x < o.x + o.w + 2 && r.x + r.w + 2 > o.x && r.y < o.y + o.h + 2 && r.y + r.h + 2 > o.y); },
  place(x, y, w, h, o = {}) {
    const minY = o.minY != null ? o.minY : 22, maxY = Math.max(minY, (o.maxY != null ? o.maxY : H - 22) - h);
    const fx = v => Math.round(clamp(v, 2, W - w - 2)), fy = v => Math.round(clamp(v, minY, maxY));
    const steps = [[0, 0]];
    for (let d = 4; d <= 72; d += 4) steps.push([0, -d], [0, d], [-d * 1.5, -d / 2], [d * 1.5, -d / 2]);
    for (const [dx, dy] of steps) {
      const r = { x: fx(x + dx), y: fy(y + dy), w, h };
      if (!this.hit(r)) { this.rects.push(r); return r; }
    }
    const r = { x: fx(x), y: fy(y), w, h }; this.rects.push(r); return r;
  }
};

const Toast = {
  list: [],
  show(text, color = PAL.sun, dur = 2.2) { this.list.push({ text, color, t: dur, max: dur }); if (this.list.length > 4) this.list.shift(); },
  update(dt) { for (const t of this.list) t.t -= dt; this.list = this.list.filter(t => t.t > 0); },
  // zonas que ocupan los avisos (para que los globos no se monten encima)
  reserveAreas() { let y = 20; for (const t of this.list) { const w = textW(t.text) + 12; Labels.reserve(W - w - 6, y, w, 15); y += 18; } },
  draw(g) {
    let y = 20;
    for (const t of this.list) {
      const w = textW(t.text) + 12;
      const slide = t.t > t.max - 0.2 ? (t.t - (t.max - 0.2)) / 0.2 : t.t < 0.25 ? 1 - t.t / 0.25 : 0;
      const x = W - w - 6 + Math.round(slide * (w + 10));
      panel(g, x, y, w, 15, { border: t.color, accent: t.color });
      drawText(g, t.text, x + 6, y + 5, t.color);
      y += 18;
    }
  }
};

// ---------- LÍA LOOP ----------
const LIA_PAL = {

  y: '#FFD84A', Y: '#E0A92A', c: '#30E1C5', C: '#C9FFF4', m: '#B5475A', b: '#FF8FA3',
  t: '#30E1C5', T: '#1FA89A', u: '#FFD84A', p: '#2A4A9A', P: '#1B3170', o: '#8B5A3C', O: '#5E3A26'
};
const LIA_HEAD = [
  '....hhhhh..',
  '..hhjjhhhh.',
  '.hhjhhhhhhh',
  '.hjhyyyyyyy',
  'hhhhycCycCy',
  'hhhhhyyyyy.',
  'hhhhshhssss',
  'hHhhsssssss',
  '.Hhhsssssss',
  '.HhSsssssss',
  '..H.SSssss.'
];
function liaHead(expr) {
  const rows = LIA_HEAD.map(r => r.split(''));
  const set = (x, y, ch) => { if (rows[y] && x >= 0 && x < rows[y].length) rows[y][x] = ch; };
  // ojos en (6,7-8) y (9,7-8); boca fila 9
  switch (expr) {
    case 'blink': set(6, 8, 'e'); set(9, 8, 'e'); set(8, 9, 'm'); break;
    case 'happy': set(5, 8, 'e'); set(6, 7, 'e'); set(7, 8, 'e'); set(9, 7, 'e'); set(10, 8, 'e'); set(8, 9, 'm'); set(9, 9, 'm'); set(5, 9, 'b'); break;
    case 'surprise': set(6, 7, 'e'); set(6, 8, 'e'); set(9, 7, 'e'); set(9, 8, 'e'); set(5, 7, 'w'); set(8, 9, 'm'); set(8, 10, 'm'); break;
    case 'hurt': set(6, 7, 'e'); set(7, 8, 'e'); set(9, 8, 'e'); set(10, 7, 'e'); set(8, 9, 'm'); set(9, 9, 'm'); break;
    case 'focus': set(6, 8, 'e'); set(9, 8, 'e'); set(6, 7, 'H'); set(9, 7, 'H'); set(8, 9, 'm'); break;
    case 'sad': set(6, 8, 'e'); set(9, 8, 'e'); set(7, 7, 'H'); set(10, 7, 'H'); set(8, 10, 'm'); break;
    default: set(6, 7, 'e'); set(6, 8, 'e'); set(9, 7, 'e'); set(9, 8, 'e'); set(8, 9, 'm'); set(5, 9, 'b');
  }
  return spriteFromRows(rows.map(r => r.join('')), LIA_PAL);
}

// pose: {bob, legA, legB (desplazamientos x del pie), liftA, liftB, arm (-2..2), hair (desplazamiento coleta), expr, squash, armUp}
function paintLia(pose, cos) {
  const c = makeCanvas(20, 27), g = c.g;
  const L = LIA_PAL;
  const by = 1 + (pose.bob || 0);
  const sq = pose.squash || 0; // aplastamiento al aterrizar
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const hipY = 19 + sq, feetY = 24;
  // mochila solar (cosmético)
  if (cos && cos.pack) { R(3, 13 + by + sq, 4, 6, '#2A4A9A'); R(3, 13 + by + sq, 4, 1, PAL.sun); R(4, 14 + by + sq, 2, 1, PAL.aqua); R(4, 16 + by + sq, 2, 1, PAL.aqua); }
  // capa eólica (cosmético)
  if (cos && cos.cape) { const sw = pose.hair || 0; R(4 - Math.max(0, sw), 13 + by + sq, 3, 8, '#7FE7FF'); R(3 - Math.max(0, sw), 18 + by + sq, 3, 3, '#59C7FF'); }
  // pierna trasera
  const leg = (fx, lift, col, colS, boot) => {
    const x0 = 8, top = hipY + by * 0;
    R(x0 + Math.round(fx / 2), top, 2, 3, col);
    R(x0 + fx, top + 3 - lift, 2, 2 + (lift ? 0 : 0), colS);
    R(x0 + fx - (fx < 0 ? 1 : 0), feetY - lift, 3, 2, boot);
  };
  const bootCol = cos && cos.boots ? '#30A8E1' : L.o, bootS = cos && cos.boots ? '#1B6FA0' : L.O;
  leg(pose.legB || 0, pose.liftB || 0, L.P, L.P, bootS);
  // brazo trasero
  R(6, 14 + by + sq, 2, 4, L.T);
  R(6, 18 + by + sq, 2, 1, L.S);
  // torso (chaqueta)
  R(7, 13 + by + sq, 6, 6 - sq, L.t);
  R(7, 13 + by + sq, 1, 6 - sq, L.T);
  R(11, 13 + by + sq, 1, 6 - sq, L.u); // cremallera amarilla
  R(7, 18 + by, 6, 1, L.T);
  // pierna delantera
  leg(pose.legA || 0, pose.liftA || 0, L.p, L.p, bootCol);
  // coleta
  const hs = pose.hair || 0;
  R(2 - hs, 5 + by + sq, 3, 2, L.h); R(1 - hs, 7 + by + sq, 3, 2, L.h); R(1 - hs, 9 + by + sq, 2, 2, L.H); R(4, 4 + by + sq, 2, 2, L.y);
  // cabeza
  g.drawImage(liaHead(pose.expr), 5, 2 + by + sq);
  // gafas debug (cosmético): lentes en los ojos
  if (cos && cos.goggles) { R(10, 9 + by + sq, 5, 2, 'rgba(48,225,197,0.65)'); R(10, 9 + by + sq, 5, 1, PAL.sun); }
  // brazo delantero
  const ay = pose.armUp ? -4 : 0;
  const ax = 10 + (pose.arm || 0);
  R(ax, 14 + by + sq + ay, 2, 4, L.t);
  R(ax, 18 + by + sq + ay, 2, 1, L.s);
  if (pose.tool) { R(ax + 2, 16 + by + sq, 3, 1, PAL.stone); R(ax + 4, 15 + by + sq, 1, 3, PAL.sun); }
  return outlined(c, OUTLINE);
}

// fotograma de reposo para escenas sin física (taller, créditos): respiración lenta y parpadeo ocasional

// ---------- LUMI (luciérnaga + gota + estrella) ----------
function buildLumi() {
  const frames = [];
  const shapes = [
    ['...#...', '..###..', '.#####.', '#######', '.#####.', '..###..', '...#...'],
    ['...#...', '..###..', '.#####.', '.#####.', '.#####.', '..###..', '.......'],
    ['.......', '..###..', '.#####.', '#######', '#######', '.#####.', '..###..']
  ];
  for (const s of shapes) frames.push(s);
  return frames; // se colorean en tiempo real según emoción
}
function drawLumiShape(g, x, y, shape, core, edge, eyes = true, mood = 'n') {
  for (let r = 0; r < shape.length; r++) for (let q = 0; q < shape[r].length; q++) {
    if (shape[r][q] !== '#') continue;
    const d = Math.abs(r - 3) + Math.abs(q - 3);
    g.fillStyle = d <= 1 ? PAL.white : d <= 2 ? core : edge;
    g.fillRect(x + q, y + r, 1, 1);
  }
  if (eyes) {
    g.fillStyle = '#1A1030';
    if (mood === 'happy') { g.fillRect(x + 2, y + 3, 1, 1); g.fillRect(x + 4, y + 3, 1, 1); }
    else if (mood === 'sleep') { g.fillRect(x + 2, y + 4, 1, 1); g.fillRect(x + 4, y + 4, 1, 1); }
    else { g.fillRect(x + 2, y + 3, 1, 2); g.fillRect(x + 4, y + 3, 1, 2); }
  }
}

// o: {skin, hair, style, shirt, pants, shoes, acc:[], kind:'adult'|'child'|'elder'|'tall', eyes}
function paintHuman(o, pose) {
  const c = makeCanvas(18, 28), g = c.g;
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const kind = o.kind || 'adult';
  const child = kind === 'child', elder = kind === 'elder', tall = kind === 'tall';
  const skin = o.skin || PAL.skin, skinS = shade(skin, -0.18);
  const hair = o.hair || '#5B3A26', hairS = shade(hair, -0.25);
  const shirt = o.shirt || PAL.coral, shirtS = shade(shirt, -0.22);
  const pants = o.pants || PAL.deep, shoes = o.shoes || '#5E3A26';
  const acc = o.acc || [];
  const feet = 27;
  const legH = child ? 3 : tall ? 6 : 5;
  const torsoH = child ? 5 : tall ? 8 : 7;
  const headH = child ? 8 : 8;
  const bob = pose.bob || 0;
  const hipY = feet - 2 - legH;
  const torsoY = hipY - torsoH + (elder ? 1 : 0);
  const headY = torsoY - headH + 1 + bob + (elder ? 1 : 0);
  const hx = elder ? 6 : 5; // posición x de la cabeza
  // piernas
  const la = pose.legA || 0, lb = pose.legB || 0;
  if (acc.includes('dress')) {
    R(6, hipY - 1, 7, legH - 1, o.dress || shirt); R(7, feet - 3, 2, 1, skin); R(10, feet - 3, 2, 1, skin);
    R(6 + Math.round(lb / 2), feet - 2, 3, 2, shoes); R(10 + Math.round(la / 2), feet - 2, 3, 2, shoes);
  } else {
    R(7 + Math.round(lb / 2), hipY, 2, legH, shade(pants, -0.2)); R(6 + lb, feet - 2, 3, 2, shade(shoes, -0.2));
    R(10 + Math.round(la / 2), hipY, 2, legH, pants); R(10 + la, feet - 2, 3, 2, shoes);
  }
  // torso
  R(6, torsoY, 7, torsoH + (acc.includes('dress') ? 0 : 1), shirt);
  R(6, torsoY, 1, torsoH, shirtS);
  if (acc.includes('apron')) { R(8, torsoY + 2, 4, torsoH - 1, o.apron || '#FFF3D7'); R(8, torsoY + 1, 1, 1, o.apron || '#FFF3D7'); R(11, torsoY + 1, 1, 1, o.apron || '#FFF3D7'); }
  if (acc.includes('labcoat')) { R(5, torsoY, 2, torsoH + 3, '#EDEBF7'); R(12, torsoY, 2, torsoH + 3, '#EDEBF7'); R(12, torsoY, 1, torsoH + 3, '#C9C5E0'); }
  if (acc.includes('toolbelt')) { R(6, hipY - 1, 7, 1, '#8B5A3C'); R(12, hipY - 1, 1, 2, PAL.stone); R(8, hipY - 1, 1, 1, PAL.sun); }
  if (acc.includes('scarf')) { R(6, torsoY, 8, 2, o.scarf || PAL.sun); R(4 - (pose.arm || 0), torsoY + 1, 3, 2, o.scarf || PAL.sun); }
  if (acc.includes('vest')) { R(7, torsoY + 1, 2, torsoH - 1, o.vest || PAL.orange); R(11, torsoY + 1, 2, torsoH - 1, o.vest || PAL.orange); }
  // brazos
  const arm = pose.arm || 0;
  R(5, torsoY + 1, 1, torsoH - 2, shirtS); R(5, torsoY + torsoH - 1, 1, 1, skinS);
  const aUp = pose.armUp ? -3 : 0;
  R(12 + (arm > 0 ? 1 : 0), torsoY + 1 + aUp, 2, torsoH - 2, shirt); R(12 + (arm > 0 ? 1 : 0), torsoY + torsoH - 1 + aUp, 2, 1, skin);
  if (acc.includes('cane')) { R(15, torsoY + 3, 1, feet - torsoY - 3, '#8B5A3C'); R(14, torsoY + 3, 2, 1, '#8B5A3C'); }
  if (acc.includes('wrench')) { R(14, torsoY + 2, 1, 4, PAL.stone); R(13, torsoY + 2, 3, 1, PAL.stone); }
  // cabeza
  const hw = child ? 7 : 8;
  R(hx, headY, hw, headH - 1, skin);
  R(hx, headY + headH - 2, hw, 1, skinS);
  // ojos
  const ex = hx + hw - 3, ey = headY + 3;
  if (pose.blink) R(ex - 2, ey + 1, 4, 1, OUTLINE);
  else { R(ex - 2, ey, 1, 2, OUTLINE); R(ex + 1, ey, 1, 2, OUTLINE); }
  if (pose.talk) R(ex - 1, ey + 3, 2, 1, '#8A3A4A'); else R(ex - 1, ey + 3, 2, 1, skinS);
  if (!child && !acc.includes('beard')) R(ex - 3, ey + 2, 1, 1, shade(skin, -0.05));
  // pelo
  const st = o.style || 'short';
  if (st === 'short' || st === 'spiky' || st === 'curly') {
    R(hx - 1, headY - 1, hw + 1, 3, hair); R(hx - 1, headY + 2, 2, 3, hair);
    if (st === 'spiky') { R(hx, headY - 2, 1, 1, hair); R(hx + 3, headY - 2, 1, 1, hair); R(hx + 6, headY - 2, 1, 1, hair); }
    if (st === 'curly') { R(hx - 2, headY, 1, 4, hair); R(hx + hw - 1, headY - 1, 2, 2, hair); R(hx + 2, headY - 2, 4, 1, hair); }
  } else if (st === 'long') {
    R(hx - 1, headY - 1, hw + 1, 3, hair); R(hx - 1, headY + 2, 3, headH + 3, hair); R(hx - 1, headY + 2, 1, headH + 3, hairS);
  } else if (st === 'bun') {
    R(hx - 1, headY - 1, hw + 1, 3, hair); R(hx - 1, headY + 2, 2, 2, hair); R(hx + 1, headY - 4, 4, 3, hair); R(hx + 1, headY - 4, 4, 1, shade(hair, 0.2));

  } else if (st === 'bald') {
    R(hx - 1, headY + 1, 2, 3, hair);
  } else if (st === 'mohawk') {
    R(hx + 1, headY - 3, 4, 3, hair); R(hx - 1, headY + 1, 2, 3, hair);
  }
  if (acc.includes('cap')) { R(hx - 1, headY - 2, hw + 1, 3, o.cap || PAL.orange); R(hx - 3, headY, 3, 1, o.cap || PAL.orange); R(hx + 2, headY - 1, 2, 1, PAL.sun); }
  if (acc.includes('hat')) { R(hx - 2, headY - 1, hw + 4, 1, o.hatC || '#2A4A9A'); R(hx, headY - 4, hw, 3, o.hatC || '#2A4A9A'); R(hx, headY - 2, hw, 1, PAL.cream); }

function buildEnemies() {

  E.bugglin = [0, 1].map(f => {

    return { r, l: flipCanvas(r) };
  });

  E.ladybug = [0, 1].map(f => {
    const rows = f ? ['..ww..ww', '.rrrr...', 'rkrrkr..', 'rrrrrr..', '.rkkr...'] : ['........', '.rrrr.ww', 'rkrrkrww', 'rrrrrr..', '.rkkr...'];
    const r = outlined(spriteFromRows(rows, { r: '#FF6B6B', k: '#1A1030', w: '#D6F6FF' }), OUTLINE);

  // SHADOW IF: rombo con "?"
  E.shadowif = [0, 1, 2, 3].map(f => {
    const c = makeCanvas(14, 14), g = c.g;
    const s = f % 2;
    for (let y = 0; y < 13; y++) { const w = 6 - Math.abs(y - 6); g.fillStyle = y < 6 ? '#5B3A8C' : '#3A2466'; g.fillRect(6 - w + s * 0, y, w * 2 + 1, 1); }
    drawText(g, '?', 5, 3, f < 2 ? '#FF7FCF' : '#C9B2FF');
    return { r: outlined(c, OUTLINE), l: outlined(c, OUTLINE) };
  });
  // DRAINER: medusa que absorbe energía
  E.drainer = [0, 1, 2].map(f => {
    const rows = [
      '..vvvvv..', '.vVVVVVv.', 'vVwVVVwVv', 'vVkVVVkVv', 'vVVVVVVVv', '.vvvvvvv.',
      f === 0 ? '.v.v.v.v.' : f === 1 ? 'v.v.v.v.v' : '.v..v..v.', f === 1 ? '.v.v.v.v.' : 'v.v...v.v'

    const r = outlined(spriteFromRows(rows, { v: '#FF4FB8', V: '#B8338A', w: '#FFFFFF', k: '#1A1030' }), OUTLINE);
    return { r, l: r };
  });
  // CHAOS PACKET: cubo que desordena datos
  E.chaos = [0, 1].map(f => {
    const rows = f ? ['.oooooo.', 'oOyOOyOo', 'oOOOOOOo', 'oO1OO0Oo', 'oOOOOOOo', '.oooooo.'] : ['.oooooo.', 'oOOyOOyo', 'oOOOOOOo', 'oO0OO1Oo', 'oOOOOOOo', '.oooooo.'];
    const r = outlined(spriteFromRows(rows, { o: '#FF9D42', O: '#C8612E', y: '#FFF3D7', '1': '#FFD84A', '0': '#FFD84A' }), OUTLINE);
    return { r, l: r };
  });
  return E;
}

  if (acc.includes('glasses')) { const gc = o.glassC || '#9B76FF'; strokeRect(g, eyeL - 2, ey - 2, 6, 6, gc); strokeRect(g, eyeR - 1, ey - 2, 6, 6, gc); R(eyeL + 4, ey, 3, 1, gc); }

function portraitPix(expr, quiet) {
  const c = makeCanvas(32, 32), g = c.g;
  const t = quiet ? '#6FB5AC' : '#30E1C5', T = quiet ? '#4F8A84' : '#1FA89A', m = quiet ? '#B86A98' : '#FF4FB8', y = quiet ? '#CFB76A' : '#FFD84A';
  pellipse(g, 17, 18, 9, 8, t); pellipse(g, 17, 21, 8, 5, T); pellipse(g, 17, 16, 7, 5, t);
  rect(g, 0, 17, 10, 3, y); rect(g, 0, 18, 10, 1, shade(y, -0.2)); // pico largo
  rect(g, 13, 7, 6, 3, m); rect(g, 15, 5, 3, 2, m); // cresta
  rect(g, 20, 24, 8, 3, m);
  // ala
  g.fillStyle = '#D6F6FF'; g.fillRect(21, 9 + (Math.floor(Time.t * 12) % 2) * 2, 9, 4); g.fillRect(25, 7, 5, 3);
  // ojo
  const K = '#1A1030';
  if (expr === 'feliz' || expr === 'risa') { rect(g, 13, 14, 1, 1, K); rect(g, 14, 13, 2, 1, K); rect(g, 16, 14, 1, 1, K); }
  else if (expr === 'triste' || expr === 'culpa') { rect(g, 13, 15, 4, 2, K); rect(g, 13, 13, 4, 1, T); }
  else if (expr === 'sorpresa') { rect(g, 12, 12, 5, 5, '#FFFFFF'); rect(g, 13, 13, 3, 3, K); }
  else { rect(g, 12, 12, 5, 4, '#FFFFFF'); rect(g, 13, 13, 3, 3, K); rect(g, 13, 13, 1, 1, '#FFFFFF'); }
  rect(g, 22, 18, 2, 2, quiet ? '#8C93B8' : '#FFD84A'); // led
  return c;
}
function portraitGeneric(kind, expr) {
  const c = makeCanvas(32, 32), g = c.g;
  if (kind === 'eclipse') {
    for (let i = 0; i < 70; i++) { const a = rand(0, 6.28), r = Math.pow(Math.random(), 0.6) * 13; rect(g, 16 + Math.cos(a) * r * 0.8, 17 + Math.sin(a) * r, 2, 2, choice(['#5B3A8C', '#9B76FF', '#3A2466', '#C9B2FF'])); }
    pellipse(g, 16, 13, 6, 6, '#2A1A44'); rect(g, 12, 12, 3, 2, '#FF7FCF'); rect(g, 18, 12, 3, 2, '#FF7FCF');
    rect(g, 10, 20, 12, 10, '#3A2466');
  } else if (kind === 'aurora') {
    rect(g, 0, 0, 32, 32, '#10162B');
    for (let r = 14; r > 2; r -= 3) pring(g, 16, 16, r, r > 10 ? '#30E1C5' : r > 6 ? '#59C7FF' : '#FFF3D7');
    pcircle(g, 16, 16, 3, '#FFFFFF');
    rect(g, 0, 15, 5, 2, '#30E1C5'); rect(g, 27, 15, 5, 2, '#30E1C5');
  } else if (kind === 'pz') {
    rect(g, 0, 0, 32, 32, '#F4F6FF');
    for (let i = 0; i < 4; i++) { const r = 13 - i * 3; for (let y = -r; y <= r; y++) { const w = r - Math.abs(y); rect(g, 16 - w, 16 + y, w * 2 + 1, 1, i % 2 ? '#FFFFFF' : '#DCE2F5'); } }
    pring(g, 16, 16, 5, '#B8C2E6'); rect(g, 15, 15, 3, 3, '#10162B');
  } else if (kind === 'prisma') {
    const cols = ['#FF6B6B', '#FF9D42', '#FFD84A', '#66D66A', '#30E1C5', '#59C7FF', '#9B76FF', '#FF7FCF'];
    for (let y = 0; y < 26; y++) { const w = Math.floor(y * 0.55); rect(g, 16 - w, 3 + y, w * 2 + 1, 1, cols[Math.floor(y / 3.3) % cols.length]); }
    rect(g, 12, 17, 2, 3, '#10162B'); rect(g, 18, 17, 2, 3, '#10162B'); rect(g, 14, 22, 4, 1, '#10162B');
  } else if (kind === 'beta') {
    rect(g, 6, 4, 20, 26, '#C9D2F0'); rect(g, 6, 4, 2, 26, '#8C96C0'); rect(g, 12, 1, 8, 3, '#8C96C0');
    rect(g, 9, 8, 14, 9, '#10162B'); rect(g, 11, 10, 3, 4, PAL.teal); rect(g, 18, 10, 3, 4, PAL.teal);
    if (expr === 'triste') { rect(g, 11, 10, 3, 1, '#10162B'); rect(g, 18, 10, 3, 1, '#10162B'); }
    rect(g, 9, 20, 14, 7, '#22306B');
  } else if (kind === 'lumi') {
    rect(g, 0, 0, 32, 32, '#10162B');
    const grd = g.createRadialGradient(16, 16, 1, 16, 16, 15); grd.addColorStop(0, 'rgba(255,216,74,0.6)'); grd.addColorStop(1, 'rgba(255,216,74,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 32, 32);
    const sh = ['.....#.....', '....###....', '...#####...', '..#######..', '.#########.', '###########', '.#########.', '..#######..', '...#####...', '....###....', '.....#.....'];
    for (let r = 0; r < 11; r++) for (let q = 0; q < 11; q++) if (sh[r][q] === '#') { const d = Math.abs(r - 5) + Math.abs(q - 5); rect(g, 5 + q * 2, 5 + r * 2, 2, 2, d <= 2 ? '#FFFFFF' : d <= 4 ? '#FFD84A' : '#FF9D42'); }
    rect(g, 12, 14, 2, 3, '#1A1030'); rect(g, 18, 14, 2, 3, '#1A1030');
  } else if (kind === 'sistema') {
    rect(g, 0, 0, 32, 32, '#10162B'); rect(g, 3, 5, 26, 20, '#22306B'); rect(g, 5, 7, 22, 16, '#0B1020');
    drawText(g, '>_', 8, 12, PAL.teal);
  }
  return c;
}

const Portraits = {
  cache: {},
  get(who, expr = 'n') {
    const key = who + ':' + expr + (who === 'pix' && flag('pixQuiet') ? ':q' : '');
    if (who === 'pix') return portraitPix(expr, flag('pixQuiet') && !flag('pixHealed'));
    if (this.cache[key]) return this.cache[key];
    let c;
    if (who === 'lia') c = paintPortraitHuman({ skin: '#F7C39A', hair: '#FF6B6B', style: 'lia', shirt: '#30E1C5' }, expr);
    else if (CAST[who]) c = paintPortraitHuman(CAST[who], expr);
    else c = portraitGeneric(who, expr);
    return (this.cache[key] = c);
  }
};

function buildAllSprites() {
  Spr.lia = buildLia(G.save.cosmetics.worn || {});
  Spr.pix = buildPix(false); Spr.pixQuiet = buildPix(true);
  Spr.lumi = buildLumi();
  Spr.cast = {};
  for (const k in CAST) Spr.cast[k] = buildHuman(CAST[k]);
  Spr.beta = buildBeta();
  Spr.enemy = buildEnemies();
  for (const k in ICON_DEFS) ICONS[k] = spriteFromRows(ICON_DEFS[k].r, ICON_DEFS[k].p);
  // Lía fantasma (eco de Step Spark)
  Spr.liaGhost = {};
  for (const k of ['idle', 'walk', 'jump', 'fall']) Spr.liaGhost[k] = Spr.lia[k].map(f => ({ r: silhouette(f.r, 'rgba(255,216,74,0.75)'), l: silhouette(f.l, 'rgba(255,216,74,0.75)') }));
}
function rebuildLia() {
  Spr.lia = buildLia(G.save.cosmetics.worn || {});
}

// ---------- ruido periódico (para fondos que se repiten sin costuras) ----------
function periodicNoise(rng, w, octaves = 4) {
  const comps = [];
  for (let o = 1; o <= octaves; o++) comps.push({ k: o * randi(1, 3) + (o === 1 ? 1 : 0), a: 1 / o, ph: rng() * Math.PI * 2 });
  const total = comps.reduce((s, c) => s + c.a, 0);
  return x => comps.reduce((s, c) => s + c.a * Math.sin(c.k * x / w * Math.PI * 2 + c.ph), 0) / total;
}

// ---------- pintores de capas de fondo ----------
const BGP = {
  sea(g, w, h, rng, o) {
    vGradient(g, 0, o.y, w, h - o.y, [[0, o.c2], [0.15, o.c1], [1, shade(o.c1, -0.4)]], false);
    for (let i = 0; i < 90; i++) { const y = o.y + 3 + Math.floor(Math.pow(rng(), 1.5) * (h - o.y)); rect(g, rng() * w, y, 4 + rng() * 14, 1, rgba(o.c2, 0.35)); }
  },
  mountains(g, w, h, rng, o) {
    const n = periodicNoise(rng, w, 5);
    const ys = [];
    for (let x = 0; x < w; x++) ys.push(o.base - (n(x) * 0.5 + 0.5) * o.amp - Math.abs(Math.sin(x / w * Math.PI * 6)) * o.amp * 0.25);
    for (let x = 0; x < w; x++) {
      const y = Math.round(ys[x]);
      // ladera iluminada según la pendiente media (sin rayas verticales)
      const lit = ys[(x + 4) % w] - ys[(x - 4 + w) % w] > 0.6;
      rect(g, x, y, 1, h - y, lit ? (o.color2 || o.color) : o.color);
      if (o.snow && y < o.base - o.amp * 0.75) rect(g, x, y, 1, 3, o.snow);
    }
  },
  hills(g, w, h, rng, o) {
    const n = periodicNoise(rng, w, 3);
    for (let x = 0; x < w; x++) {
      const y = Math.round(o.base - (n(x) * 0.5 + 0.5) * o.amp);
      rect(g, x, y, 1, h - y, o.color); rect(g, x, y, 1, 2, o.hi);
      if (o.flowers && rng() < 0.12) rect(g, x, y + 3 + rng() * 20, 1, 1, choice(o.flowers));
    }
  },
  trees(g, w, h, rng, o) {
    const n = o.count || 6;
    for (let i = 0; i < n * 2; i++) {
      const x = (i / (n * 2)) * w + rng() * 30, s = 0.7 + rng() * 0.6;
      const base = o.base + rng() * 6;
      const c = o.color, c2 = o.color2 || shade(o.color, 0.12);
      const draw = (xx) => {
        if (o.type === 'palm') {
          rect(g, xx, base - 40 * s, 3, 40 * s, shade(c, -0.1));
          for (let k = 0; k < 5; k++) { const a = -2.6 + k * 0.55; for (let r = 0; r < 18 * s; r++) rect(g, xx + 1 + Math.cos(a) * r, base - 40 * s + Math.sin(a) * r * 0.6 + r * r * 0.02, 3, 2, c); }
        } else if (o.type === 'pine') {
          for (let y = 0; y < 40 * s; y++) { const ww = y * 0.35; rect(g, xx - ww, base - 44 * s + y, ww * 2 + 1, 1, y % 6 < 3 ? c : c2); }
          rect(g, xx - 1, base - 6, 3, 6, shade(c, -0.2));
        } else if (o.type === 'tall') {
          rect(g, xx - 2, base - 120 * s, 5, 130 * s, shade(c, -0.1));
          pcircle(g, xx, base - 120 * s, 16 * s, c); pcircle(g, xx - 12 * s, base - 105 * s, 12 * s, c); pcircle(g, xx + 12 * s, base - 108 * s, 13 * s, c);
          for (let v = 0; v < 3; v++) rect(g, xx - 14 * s + v * 12, base - 100 * s, 1, 30 + rng() * 40, shade(c, 0.15));
        } else {
          rect(g, xx - 1, base - 18 * s, 3, 18 * s, shade(c, -0.15));
          pcircle(g, xx, base - 24 * s, 11 * s, c); pcircle(g, xx - 7 * s, base - 18 * s, 8 * s, c); pcircle(g, xx + 7 * s, base - 19 * s, 8 * s, c);
          pcircle(g, xx - 3 * s, base - 28 * s, 5 * s, c2);
        }
      };
      draw(x); if (x > w - 60) draw(x - w); if (x < 60) draw(x + w);
    }
    rect(g, 0, o.base + 4, w, h, o.color);
  },
  ferns(g, w, h, rng, o) {
    for (let x = 0; x < w; x += 3) {
      const hh = 10 + rng() * 26;
      for (let k = 0; k < hh; k++) rect(g, x + Math.sin(k * 0.3) * 2, o.base - k, 2, 1, k > hh - 4 ? o.color2 : o.color);

  city(g, w, h, rng, o) {

      if (o.roofs && rng() < 0.6) { for (let k = 0; k < bw / 2 + 2; k++) rect(g, x + k - 1, top - k * 0.6, bw - k * 2 + 2, 1, shade(col, -0.1)); }
      if (o.panels && rng() < 0.5) { rect(g, x + 2, top - 3, bw - 4, 2, '#2A4A9A'); rect(g, x + 3, top - 3, bw - 6, 1, '#7FE7FF'); }
      if (o.pipes && rng() < 0.4) { rect(g, x + bw - 5, top - 12, 3, 12, shade(col, -0.2)); }
      // ventanas
      for (let wy = top + 4; wy < o.base - 2; wy += 6) for (let wx = x + 3; wx < x + bw - 3; wx += 5) {

      // rótulos de neón colgados de la fachada (no flotando en el cielo)

  },
  islands(g, w, h, rng, o) {
    for (let i = 0; i < o.count; i++) {
      const cx = rng() * w, iw = 30 + rng() * 60, ih = 6 + rng() * 14;

        if (rng() < 0.4) { rect(g, x, o.base - ih - 16, 2, 16, o.color); rect(g, x - 1, o.base - ih - 18, 4, 3, o.lights ? '#FFD84A' : shade(o.color, 0.1)); }
      }
    }
  },
  clouds(g, w, h, rng, o) {
    for (let i = 0; i < o.count; i++) {
      const cx = rng() * w, cy = o.y + rng() * 20, s = o.big ? 1.6 + rng() : 0.8 + rng() * 0.8;
      for (let k = -1; k <= 1; k++) {
        const x = cx + k * w;
        pcircle(g, x, cy + 4, 14 * s, o.shadow); pcircle(g, x - 14 * s, cy + 8, 10 * s, o.shadow); pcircle(g, x + 16 * s, cy + 8, 11 * s, o.shadow);
        pcircle(g, x, cy, 14 * s, o.color); pcircle(g, x - 14 * s, cy + 5, 10 * s, o.color); pcircle(g, x + 16 * s, cy + 5, 11 * s, o.color);
      }
    }
    rect(g, 0, o.y + 18, w, h, o.color);
  },
  floaters(g, w, h, rng, o) {
    for (let i = 0; i < o.count; i++) {
      const cx = (i + rng() * 0.5) / o.count * w, cy = 70 + rng() * 90, iw = 20 + rng() * 40;
      for (let y = 0; y < iw * 0.6; y++) { const ww = iw / 2 * (1 - y / (iw * 0.6)); rect(g, cx - ww, cy + y, ww * 2, 1, y < 2 ? o.color2 : o.color); }
      rect(g, cx - iw / 2, cy - 2, iw, 2, '#9CF5D8');
    }
  },
  windmills(g, w, h, rng, o) {
    const hubs = [];
    for (let i = 0; i < o.count; i++) {
      const x = Math.round((i + 0.3 + rng() * 0.4) / o.count * w), base = Math.round(o.base + rng() * 8);
      const hh = Math.round(34 + rng() * 14);
      if (o.floating) { pellipse(g, x, base + 4, 18, 7, '#AFC0FF'); rect(g, x - 18, base, 36, 3, '#9CF5D8'); }
      for (let y = 0; y < hh; y++) { const ww = 3 + y * 0.12; rect(g, x - ww, base - hh + y, ww * 2, 1, o.color); }
      for (let k = 0; k < 7; k++) rect(g, x - 5 - k * 0.2 + k, base - hh - 5 + k, 10 - k * 2 + 2, 1, o.roof);
      rect(g, x - 1, base - 8, 3, 8, shade(o.color, -0.3));
      rect(g, x - 1, base - hh + 5, 3, 3, shade(o.color, -0.35)); // ventana
      hubs.push({ x, y: base - hh + 1, r: 15 + (hh - 34) * 0.4, color: shade(o.color, -0.08), sail: '#FFF3D7' });
    }
    return { hubs };
  },
  mirrors(g, w, h, rng, o) {
    for (let i = 0; i < o.count * 2; i++) {
      const x = rng() * w, y = o.base + rng() * 10;
      rect(g, x, y - 12, 1, 12, '#8A6A4A');
      for (let k = 0; k < 10; k++) rect(g, x - 6 + k * 0.4, y - 16 + k * 0.5, 12, 1, k < 2 ? '#FFFFFF' : k % 3 ? '#59C7FF' : '#7FE7FF');
    }
    rect(g, 0, o.base + 12, w, h, '#E8C880');
  },
  waterfalls(g, w, h, rng, o) {
    // acantilados con cascada: la roca llega hasta la base y el agua cae por una hendidura
    for (let i = 0; i < o.count; i++) {
      const x = (i + 0.2 + rng() * 0.5) / o.count * w;
      const top = 70 + rng() * 40, cw = 46 + rng() * 20;
      const rock = o.rock, rockS = shade(o.rock, -0.12), rockD = shade(o.rock, -0.22);
      for (let k = -1; k <= 1; k++) {
        const xx = x + k * w;
        // masa rocosa con borde irregular
        for (let yy = top; yy < o.base + 4; yy++) {
          const f = (yy - top) / (o.base - top);
          const half = cw / 2 + Math.sin(yy * 0.21 + i) * 2 + f * 8;
          rect(g, xx - half, yy, half * 2, 1, yy % 7 === 0 ? rockS : rock);
          rect(g, xx + half - 4, yy, 4, 1, rockD);
        }
        rect(g, xx - cw / 2 - 1, top - 2, cw + 2, 3, '#66D6A0'); rect(g, xx - cw / 2 + 4, top - 4, 10, 2, '#8FE8B8');
        // cascada
        const sw = 8 + (i % 2) * 4;
        rect(g, xx - sw / 2, top - 1, sw, o.base - top + 1, '#DFFBFF');
        for (let yy = top; yy < o.base; yy += 3) rect(g, xx - sw / 2 + ((yy / 3) % 3), yy, 1, 2, '#FFFFFF');
        rect(g, xx - 1, top, 2, o.base - top, '#FFFFFF');
        // espuma en la base
        pellipse(g, xx, o.base, sw + 6, 4, '#FFFFFF'); pellipse(g, xx - sw, o.base + 1, 5, 2, '#EFFFFF');
        if (o.coral) { rect(g, xx - cw / 2 - 2, o.base - 8, 3, 8, o.coral); rect(g, xx - cw / 2 + 2, o.base - 5, 2, 5, o.coral); }
      }
    }
  },
  market(g, w, h, rng, o) {
    let x = 0; const cols = ['#FF6B6B', '#FFD84A', '#FF9D42', '#FF7FCF', '#30E1C5'];
    while (x < w) {
      const sw = 26 + rng() * 14;
      const c = choice(cols);
      rect(g, x, o.base - 26, 2, 26, '#5E3A26'); rect(g, x + sw - 2, o.base - 26, 2, 26, '#5E3A26');
      for (let k = 0; k < sw; k += 4) { rect(g, x + k, o.base - 30, 4, 6, k % 8 ? c : '#FFF3D7'); rect(g, x + k, o.base - 24, 4, 2, k % 8 ? shade(c, -0.2) : '#E8D8B8'); }
      rect(g, x + 2, o.base - 10, sw - 4, 10, '#8B5A3C');
      for (let k = 0; k < 5; k++) pcircle(g, x + 6 + k * 4, o.base - 12, 2, choice(['#FF6B6B', '#FFD84A', '#B6F35B', '#FF9D42']));
      x += sw + 20 + rng() * 30;
    }
    rect(g, 0, o.base, w, h, '#2A5A3A');
  },
  cave(g, w, h, rng, o) {
    const n = periodicNoise(rng, w, 4), n2 = periodicNoise(rng, w, 4);
    for (let x = 0; x < w; x++) {
      const top = 40 + (n(x) * 0.5 + 0.5) * 50 + (x % 23 < 3 ? 20 : 0);
      rect(g, x, 0, 1, top, o.color);
      if (o.lower) { const b = 200 + (n2(x) * 0.5 + 0.5) * 40; rect(g, x, b, 1, h - b, o.color2); }
    }
    for (let i = 0; i < 26; i++) {
      const x = rng() * w, y = o.lower ? 200 + rng() * 30 : 30 + rng() * 60, c = choice(o.crystals);
      for (let k = 0; k < 8; k++) rect(g, x - (4 - Math.abs(k - 4)) * 0.5, y - k, (4 - Math.abs(k - 4)) + 1, 1, k < 3 ? '#FFFFFF' : c);
    }
  },
  pipesBg(g, w, h, rng, o) {
    for (let i = 0; i < 6; i++) {
      const y = o.y + i * 8 + rng() * 6;
      rect(g, 0, y, w, 4, o.color); rect(g, 0, y, w, 1, o.hi);
      for (let x = rng() * 60; x < w; x += 60 + rng() * 80) { rect(g, x, y - 1, 3, 6, o.hi); }
    }
  },
  tanks(g, w, h, rng, o) {
    let x = 10;
    while (x < w) {
      const r = 10 + rng() * 12, c = choice(o.colors);
      rect(g, x, o.base - r * 2, r * 2, r * 2, c); pellipse(g, x + r, o.base - r * 2, r, 4, shade(c, 0.2));
      rect(g, x + 3, o.base - r * 2, 2, r * 2, shade(c, 0.3));
      drawText(g, 'H2', x + r - 4, o.base - r - 3, shade(c, -0.4));
      x += r * 2 + 12 + rng() * 30;
    }
    rect(g, 0, o.base, w, h, '#C9D2F0');
  },
  cranes(g, w, h, rng, o) {
    for (let i = 0; i < 4; i++) {
      const x = (i + rng() * 0.5) / 4 * w;
      rect(g, x, o.base - 70, 4, 70, o.color); rect(g, x - 30, o.base - 70, 60, 3, o.color);

    }
    rect(g, 0, o.base, w, h, '#565E8C');

  batteries(g, w, h, rng, o) {
    let x = 0;
    while (x < w) {
      const bw = 22 + rng() * 14, bh = 50 + rng() * 60, soc = rng();
      const top = o.base - bh;
      rect(g, x, top, bw, bh + 80, '#2A2F6A'); rect(g, x + bw / 2 - 4, top - 5, 8, 5, '#565E8C');
      const col = soc > 0.6 ? '#B6F35B' : soc > 0.3 ? '#FFD84A' : '#FF6B6B';

      rect(g, x + 3, o.base - 3 - fill, bw - 6, fill, col); rect(g, x + 3, o.base - 3 - fill, 2, fill, shade(col, 0.3));
      strokeRect(g, x + 2, top + 2, bw - 4, bh - 4, '#565E8C');
      x += bw + 8 + rng() * 26;
    }
  },
  prismTowers(g, w, h, rng, o) {
    const cols = ['#FF6B6B', '#FF9D42', '#FFD84A', '#66D66A', '#30E1C5', '#59C7FF', '#9B76FF', '#FF7FCF'];
    for (let i = 0; i < 8; i++) {
      const x = (i + rng() * 0.6) / 8 * w, hh = 50 + rng() * 60, c = cols[i % cols.length];

      rect(g, x - 1, o.base - hh - 4, 2, 4, '#FFFFFF');
    }
  }
};

// ---------- Construcción del fondo de una región ----------
// aspas giratorias de los molinos del fondo (las torres están pintadas en la capa)
function drawLayerBlades(g, L, ox, oy, t, speed) {
  if (!L.meta || !L.meta.hubs) return;
  for (const hb of L.meta.hubs) for (const off of [0, 960]) {
    const hx = hb.x + ox + off, hy = hb.y + oy;
    if (hx < -30 || hx > W + 30) continue;
    const a0 = t * speed + hb.x;
    for (let k = 0; k < 4; k++) {
      const a = a0 + k * Math.PI / 2, ca = Math.cos(a), sa = Math.sin(a);
      for (let r = 2; r < hb.r; r++) { px(g, hx + ca * r, hy + sa * r, hb.color); if (r > 5) px(g, hx + ca * r - sa * 2, hy + sa * r + ca * 2, hb.sail); }
    }

function tileSolid(t) { return t === '#' || t === 'B'; }
function paintSolidTile(g, x, y, mask, th, rng) {

    }

  }

    if (tt === 'marble' && rng() < 0.3) pline(g, x + 2, y + 3, x + 9, y + 11, shade(G2.fill2, -0.05));
  } else {
    for (let i = 0; i < 5; i++) { const sx = x + Math.floor(rng() * 14), sy = y + Math.floor(rng() * 14); rect(g, sx, sy, 2, 1, G2.fill2); if (rng() < 0.3) px(g, sx, sy - 1, shade(G2.fill, 0.12)); }
  }

  if (right) { rect(g, x + 15, y, 1, 16, G2.edge); rect(g, x + 14, y, 1, 16, shade(G2.fill, -0.12)); }
  if (bottom) { rect(g, x, y + 15, 16, 1, G2.edge); rect(g, x, y + 14, 16, 1, shade(G2.fill, -0.12)); if (th.ground.roots && rng() < 0.6) { const rx = x + randi(2, 13); rect(g, rx, y + 16, 1, randi(2, 7), '#6A5AA0'); } }

        for (let i = 0; i < 16; i += 2) rect(g, x + i, y + 4, 1, 1 + ((i * 7 + x) % 3), G2.topC);
        if (tt === 'leafy') for (let i = 0; i < 3; i++) rect(g, x + randi(0, 13), y + 1, 3, 1, G2.topHi);
        if (tt === 'moss') for (let i = 0; i < 3; i++) px(g, x + randi(0, 15), y + randi(1, 3), '#FFFFFF');
        break;
      case 'planks':
        rect(g, x, y, 16, 5, G2.topC); rect(g, x, y, 16, 1, G2.topHi); rect(g, x, y + 5, 16, 1, G2.edge);

        break;
      case 'tiles':
        for (let i = 0; i < 16; i += 4) rect(g, x + i, y, 4, 3, (i / 4 + x / 16) % 2 ? G2.topC : '#FFD84A');
        rect(g, x, y, 16, 1, G2.topHi); rect(g, x, y + 3, 16, 1, shade(G2.fill, -0.2));
        break;
      case 'rock':
        rect(g, x, y, 16, 3, G2.topC); rect(g, x, y, 16, 1, G2.topHi);
        for (let i = 0; i < 3; i++) rect(g, x + randi(0, 13), y + 3, 3, 1, G2.topC);
        break;
      case 'metal':
        rect(g, x, y, 16, 3, G2.topC); rect(g, x, y, 16, 1, G2.topHi);
        for (let i = 0; i < 16; i += 8) { rect(g, x + i, y + 3, 4, 1, '#FFD84A'); rect(g, x + i + 4, y + 3, 4, 1, '#10162B'); }

}

// =====================================================================
//  UI INMEDIATA: botones, foco con teclado, arrastrar/soltar, táctil
//  Los widgets se registran al dibujar; los clics se resuelven en update.
// =====================================================================
const UI = {
  items: [], last: [], focus: null, hover: null, press: null,
  clicks: new Set(), drops: [], held: null, heldFrom: null, dragging: null, dragFrom: null,
  nav: false, scope: null, tooltip: null, blink: 0, lastFocusMove: 0,
  beginFrame() { this.last = this.items; this.items = []; this.tooltip = null; if (this.scope && !this.last.some(i => i.group === this.scope)) this.scope = null; },
  register(id, x, y, w, h, o = {}) {
    const it = { id, x, y, w, h, nav: o.nav !== false, drag: o.drag, drop: !!o.drop, group: o.group || null, disabled: !!o.disabled };
    this.items.push(it);
    return {
      hover: this.hover === id, focus: this.nav && this.focus === id, pressed: this.press === id && Input.pointer.down,
      held: this.held != null && this.heldFrom === id, dragging: this.dragging != null && this.dragFrom === id
    };
  },
  clicked(id) { if (this.clicks.has(id)) { this.clicks.delete(id); return true; } return false; },
  dropped(id) {
    const i = this.drops.findIndex(d => d.target === id);
    if (i < 0) return null;
    const d = this.drops[i]; this.drops.splice(i, 1); return d;
  },
  anyDrop() { return this.drops.length ? this.drops.shift() : null; },
  cancelHeld() { this.held = null; this.heldFrom = null; },
  setFocus(id) { this.focus = id; },
  topAt(x, y) {
    for (let i = this.last.length - 1; i >= 0; i--) { const it = this.last[i]; if (!it.disabled && x >= it.x && x < it.x + it.w && y >= it.y && y < it.y + it.h) return it; }
    return null;
  },
  update() {
    this.blink += 1 / 60;
    const P = Input.pointer;
    const over = this.topAt(P.x, P.y);
    const newHover = over ? over.id : null;
    if (newHover && newHover !== this.hover && Input.lastDevice === 'mouse') AudioSys.sfx('hover');
    this.hover = newHover;
    if (P.pressed) {
      this.press = over ? over.id : null;
      this.pressItem = over;
      if (over) { this.focus = over.id; }
    }
    if (P.down && this.pressItem && this.pressItem.drag != null && P.moved && !this.dragging) {
      this.dragging = this.pressItem.drag; this.dragFrom = this.pressItem.id; this.cancelHeld();
    }
    if (P.released) {
      if (this.dragging != null) {
        const tgt = this.topAt(P.x, P.y);
        if (tgt && tgt.drop) this.drops.push({ target: tgt.id, payload: this.dragging, from: this.dragFrom });
        else this.drops.push({ target: null, payload: this.dragging, from: this.dragFrom });
        this.dragging = null; this.dragFrom = null;
      } else if (over && this.press === over.id) {
        this.activate(over);
      }
      this.press = null; this.pressItem = null;
    }
    // navegación con teclado / mando
    if (this.nav) {
      const dirs = [['left', -1, 0], ['right', 1, 0], ['up', 0, -1], ['down', 0, 1]];
      for (const [a, dx, dy] of dirs) if (Input.hit(a)) this.moveFocus(dx, dy);
      if (Input.hit('confirm') || (Input.hit('interact') && !Input.hit('confirm'))) {
        const it = this.last.find(i => i.id === this.focus);
        if (it && !it.disabled) this.activate(it);
      }
      if (!this.last.find(i => i.id === this.focus && i.nav && (!this.scope || i.group === this.scope))) {
        const first = this.last.find(i => i.nav && !i.disabled && (!this.scope || i.group === this.scope));
        if (first) this.focus = first.id;
      }
    }
    if (Input.hit('back') && this.held != null) { this.cancelHeld(); Input.consume(); }
    // limpiar entradas no consumidas tras un tiempo
    if (this.clicks.size && !P.released && !Input.hit('confirm')) { this._age = (this._age || 0) + 1; if (this._age > 3) { this.clicks.clear(); this._age = 0; } } else this._age = 0;
    if (this.drops.length > 4) this.drops.splice(0, this.drops.length - 4);
  },
  activate(it) {
    if (it.disabled) return;
    if (this.held != null && it.drop) {
      this.drops.push({ target: it.id, payload: this.held, from: this.heldFrom });
      this.cancelHeld();
      return;
    }
    if (it.drag != null) {
      // clic en elemento arrastrable = tomarlo (modo seleccionar-y-colocar)
      if (this.heldFrom === it.id) { this.cancelHeld(); }
      else { this.held = it.drag; this.heldFrom = it.id; AudioSys.sfx('select'); }
      this.clicks.add(it.id);
      return;
    }
    this.clicks.add(it.id);
  },
  moveFocus(dx, dy) {
    const cur = this.last.find(i => i.id === this.focus);
    const cands = this.last.filter(i => i.nav && !i.disabled && i.id !== this.focus && (!this.scope || i.group === this.scope));
    if (!cur) { if (cands[0]) this.focus = cands[0].id; return; }
    const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
    let best = null, bd = 1e9;
    for (const c of cands) {
      const ox = c.x + c.w / 2 - cx, oy = c.y + c.h / 2 - cy;
      const along = ox * dx + oy * dy;
      if (along <= 2) continue;
      const perp = Math.abs(ox * dy) + Math.abs(oy * dx);
      const d = along + perp * 2.2;
      if (d < bd) { bd = d; best = c; }
    }
    if (best) { this.focus = best.id; AudioSys.sfx('hover'); }
  },
  // ---------- widgets dibujados ----------
  btn(g, id, x, y, w, h, label, o = {}) {
    const st = this.register(id, x, y, w, h, o);
    const col = o.color || PAL.teal;
    const hc = G.save.settings.highContrast;
    const active = st.hover || st.focus;
    const dy = st.pressed ? 1 : 0;
    let bg = o.bg || (o.primary ? shade(col, -0.45) : hc ? '#05070F' : '#1C2550');
    if (active) bg = shade(bg, 0.12);
    if (o.disabled) bg = '#1A1F38';
    rect(g, x + 1, y + dy, w - 2, h, bg); rect(g, x, y + 1 + dy, w, h - 2, bg);
    const bcol = o.disabled ? '#3A4068' : active ? (hc ? PAL.white : shade(col, 0.2)) : o.primary ? col : (hc ? PAL.white : '#3E4C8A');
    strokeRect(g, x, y + dy, w, h, bcol);
    px(g, x, y + dy, '#10162B'); px(g, x + w - 1, y + dy, '#10162B'); px(g, x, y + h - 1 + dy, '#10162B'); px(g, x + w - 1, y + h - 1 + dy, '#10162B');
    if (!st.pressed) rect(g, x + 1, y + h, w - 2, 1, 'rgba(0,0,0,0.35)');
    if (o.icon) icon(g, o.icon, x + 4, y + Math.floor((h - 8) / 2) + dy);
    const tx = o.icon ? x + 14 + (w - 14) / 2 : x + w / 2;
    // etiquetas largas se recortan con «…» y muestran el texto completo como ayuda
    const maxW = w - (o.icon ? 16 : 4);
    if (label && label.length > 1 && textW(label) > maxW) {
      const full = label;
      while (label.length > 1 && textW(label + '…') > maxW) label = label.slice(0, -1);
      label = label.trimEnd() + '…';
      if (!o.tip && st.hover) this.tooltip = full;
    }
    drawText(g, label, Math.round(tx), y + Math.floor((h - 7) / 2) + dy, o.disabled ? '#5A6090' : active ? PAL.white : (o.textColor || PAL.cream), { align: 'center' });
    if (st.focus && Input.lastDevice !== 'mouse' && Input.lastDevice !== 'touch') this.focusRing(g, x, y + dy, w, h);
    if (o.tip && st.hover) this.tooltip = o.tip;
    return this.clicked(id);
  },
  focusRing(g, x, y, w, h, col = PAL.sun) {
    const on = Math.floor(this.blink * 4) % 2 === 0;
    strokeRect(g, x - 2, y - 2, w + 4, h + 4, on ? col : shade(col, -0.35));
  },
  toggle(g, id, x, y, w, label, value, o = {}) {
    const clicked = this.btn(g, id, x, y, w, 14, label + ': ' + (value ? 'SÍ' : 'NO'), Object.assign({ color: value ? PAL.lime : PAL.coral }, o));
    return clicked;
  },
  drawTooltip(g) {
    if (!this.tooltip) return;
    const lines = wrapRich(this.tooltip, 160);
    const w = Math.min(170, Math.max(...lines.map(l => l.reduce((s, x) => s + (x.t === ' ' ? 3 : textW(x.t) + 1), 0))) + 10);
    const h = lines.length * 11 + 6;
    let x = Input.pointer.x + 8, y = Input.pointer.y + 10;
    if (x + w > W - 2) x = W - w - 2; if (y + h > H - 2) y = Input.pointer.y - h - 4;
    panel(g, x, y, w, h, { border: PAL.sun });
    lines.forEach((ln, i) => drawRichLine(g, ln, x + 5, y + 5 + i * 11));
  }
};

const TouchPad = {
  visible: false, alpha: 0,
  buttons() {
    return [
      { a: 'left', x: 8, y: 204, w: 36, h: 36, label: '◀' },
      { a: 'right', x: 50, y: 204, w: 36, h: 36, label: '▶' },
      { a: 'up', x: 29, y: 166, w: 36, h: 34, label: '▲' },
      { a: 'down', x: 29, y: 242, w: 36, h: 26, label: '▼' },
      { a: 'jump', x: 430, y: 206, w: 42, h: 42, label: 'A', col: PAL.lime },
      { a: 'interact', x: 384, y: 222, w: 38, h: 34, label: 'E', col: PAL.sun },
      { a: 'ability', x: 438, y: 164, w: 34, h: 34, label: 'Q', col: PAL.pink },
      { a: 'lens', x: 396, y: 180, w: 32, h: 32, label: 'F', col: PAL.teal },
      { a: 'pause', x: 446, y: 4, w: 28, h: 18, label: '≡', col: PAL.cream }
    ];
  },
  shouldShow() {
    const s = G.save.settings.touch;
    return s === 'on' || (s === 'auto' && Input.lastDevice === 'touch');
  },
  update(active) {
    this.visible = active && this.shouldShow();
    const target = this.visible ? 1 : 0;
    this.alpha = approach(this.alpha, target, 0.1);
    for (const b of this.buttons()) Input.virtual[b.a] = false;
    if (!this.visible) return;
    for (const [, t] of Input.touches) {
      for (const b of this.buttons()) {
        if (t.x >= b.x - 4 && t.x < b.x + b.w + 4 && t.y >= b.y - 4 && t.y < b.y + b.h + 4) Input.virtual[b.a] = true;
      }
    }
  },
  consumesPointer(x, y) {
    if (!this.visible) return false;
    return this.buttons().some(b => x >= b.x - 4 && x < b.x + b.w + 4 && y >= b.y - 4 && y < b.y + b.h + 4);
  },
  draw(g) {
    if (this.alpha <= 0.01) return;
    g.globalAlpha = this.alpha * 0.8;
    for (const b of this.buttons()) {
      const on = Input.virtual[b.a];
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      pcircle(g, cx, cy, Math.min(b.w, b.h) / 2, on ? 'rgba(255,255,255,0.45)' : 'rgba(16,22,43,0.55)');
      pring(g, cx, cy, Math.min(b.w, b.h) / 2, b.col || PAL.cream);
      drawText(g, b.label, cx, cy - 3, b.col || PAL.cream, { align: 'center' });
    }
    g.globalAlpha = 1;
  }
};
